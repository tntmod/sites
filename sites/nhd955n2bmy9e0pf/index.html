<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const errBox=document.getElementById('errorBox');
function showError(msg){console.error(msg);errBox.style.display='block';
errBox.textContent='خطا: '+(msg?.message||msg);
setTimeout(()=>{errBox.style.display='none';},6000);}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason));

const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const key2=(x,y)=>x+','+y;
const IS_TOUCH=matchMedia('(pointer: coarse)').matches;
const ARENA=22;
const SUN_DIR=new THREE.Vector3(0.4,0.45,0.55).normalize();

/* Quality profiles — high detail + clean natural lighting (no washed-out bloom) */
const QUALITY_PROFILES={
low:{pixelRatio:1,shadowMap:512,bloom:false,bloomStrength:.25,grassCount:1200,
fireflyCount:30,cloudCount:8,shadowEnabled:true,name:'پایین'},
medium:{pixelRatio:1.4,shadowMap:1024,bloom:true,bloomStrength:.4,grassCount:6000,
fireflyCount:90,cloudCount:18,shadowEnabled:true,name:'متوسط'},
high:{pixelRatio:1.75,shadowMap:2048,bloom:true,bloomStrength:.5,grassCount:12000,
fireflyCount:160,cloudCount:28,shadowEnabled:true,name:'بالا'},
ultra:{pixelRatio:2.2,shadowMap:3072,bloom:true,bloomStrength:.55,grassCount:18000,
fireflyCount:220,cloudCount:40,shadowEnabled:true,name:'فوق‌العاده'}
};
const QUALITY={...QUALITY_PROFILES.ultra,level:'ultra',auto:true};

/* AUDIO */
let actx=null;
function initAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
if(actx.state==='suspended')actx.resume();}catch(e){}}
const firstTouch=()=>{initAudio();
window.removeEventListener('touchstart',firstTouch);
window.removeEventListener('mousedown',firstTouch);
window.removeEventListener('keydown',firstTouch);};
window.addEventListener('touchstart',firstTouch,{passive:true});
window.addEventListener('mousedown',firstTouch);
window.addEventListener('keydown',firstTouch);

function tone(freq,dur,type='sine',vol=.06,slide=null){
if(!actx)return;try{const t=actx.currentTime;const o=actx.createOscillator(),g=actx.createGain();
o.type=type;o.frequency.setValueAtTime(freq,t);
if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function noiseBurst(dur=.08,vol=.1){
if(!actx)return;try{const size=Math.floor(actx.sampleRate*dur);
const buf=actx.createBuffer(1,size,actx.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<size;i++)d[i]=(Math.random()*2-1)*(1-i/size);
const src=actx.createBufferSource();src.buffer=buf;const g=actx.createGain();g.gain.value=vol;
const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=1500;
src.connect(f);f.connect(g);g.connect(actx.destination);src.start();}catch(e){}}
function chord(freqs,dur=.35,vol=.05){freqs.forEach((f,i)=>setTimeout(()=>tone(f,dur,'triangle',vol),i*55));}

/* RENDERER — highest quality, balanced exposure */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false,alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2.2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xa8cbe8,0.0105);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);
const uTime={value:0};

/* SKY */
const skyUniforms={
topColor:{value:new THREE.Color(0x1f6fd0)},
midColor:{value:new THREE.Color(0x8ec9f5)},
horizon:{value:new THREE.Color(0xffe0b0)},
sunDir:{value:SUN_DIR.clone()},
sunColor:{value:new THREE.Color(0xfff3cf)},
uTime:{value:0},
uSpace:{value:0},
uNebula:{value:0}
};
const skyMat=new THREE.ShaderMaterial({
side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyUniforms,
vertexShader:`varying vec3 vDir;
void main(){vec4 wp=modelMatrix*vec4(position,1.0);vDir=wp.xyz;
gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
fragmentShader:`
uniform vec3 topColor,midColor,horizon,sunColor,sunDir;
uniform float uTime,uSpace,uNebula;
varying vec3 vDir;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);
float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;
for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=.5;}return v;}
void main(){
vec3 d=normalize(vDir);
float h=clamp(d.y,-0.15,1.0);
vec3 col=mix(horizon,midColor,smoothstep(-0.02,0.32,h));
col=mix(col,topColor,smoothstep(0.22,0.85,h));
if(uSpace<0.5&&d.y>0.02){
vec2 uv=d.xz/max(d.y,0.08)*0.35;
uv+=vec2(uTime*0.008,uTime*0.005);
float c1=fbm(uv*0.8);float c2=fbm(uv*1.8+10.);
float cloud=smoothstep(0.55,0.85,c1*0.6+c2*0.4);
cloud*=smoothstep(0.02,0.35,d.y);
vec3 cloudCol=mix(vec3(0.95,0.97,1.0),vec3(1.0,0.95,0.88),c2);
col=mix(col,cloudCol,cloud*0.75);}
if(uSpace>0.5){
vec2 sp=d.xy*3.5+d.zx*2.3;
float star=step(0.9985,hash(floor(sp*220.)));
float star2=step(0.9997,hash(floor(sp*420.+7.)));
float star3=step(0.99985,hash(floor(sp*650.+13.)));
col+=vec3(star)*2.5+vec3(star2)*6.0+vec3(1.,.9,.7)*star3*9.0;
float neb=fbm(d.xy*2.5+d.zx*1.8);
float neb2=fbm(d.xy*4.0-d.zx*3.2+uTime*.01);
col+=vec3(0.4,0.15,0.6)*neb*0.4;
col+=vec3(0.15,0.35,0.7)*(1.0-neb)*0.25;
col+=vec3(0.7,0.3,0.5)*neb2*0.15;
}
if(uNebula>0.5&&uSpace<0.5){
float n=fbm(d.xy*1.5+d.zx*1.2);
col+=vec3(0.3,0.1,0.4)*n*0.3;
}
float s=max(dot(d,normalize(sunDir)),0.0);
if(uSpace<0.5){
col+=sunColor*pow(s,900.0)*8.0;
col+=sunColor*pow(s,60.0)*1.2;
col+=sunColor*pow(s,8.0)*0.4;
}
gl_FragColor=vec4(col,1.0);
}`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,40,24),skyMat);
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);

function radialTexture(inner='rgba(255,255,255,1)',outer='rgba(255,255,255,0)'){
const c=document.createElement('canvas');c.width=c.height=128;
const ctx=c.getContext('2d');const g=ctx.createRadialGradient(64,64,0,64,64,64);
g.addColorStop(0,inner);g.addColorStop(0.25,'rgba(255,240,200,.75)');
g.addColorStop(0.6,'rgba(255,220,180,.2)');g.addColorStop(1,outer);
ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({
map:radialTexture(),color:0xfff2c8,transparent:true,
blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:.95}));
sunGlow.scale.setScalar(110);scene.add(sunGlow);

/* LIGHTS — cinematic but balanced (no over-bloom) */
const hemi=new THREE.HemisphereLight(0xbcdcff,0x3c5a2c,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,1.8);sun.castShadow=true;
sun.shadow.camera.left=-36;sun.shadow.camera.right=36;
sun.shadow.camera.top=36;sun.shadow.camera.bottom=-36;
sun.shadow.camera.near=4;sun.shadow.camera.far=120;
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.028;
sun.shadow.radius=2.2;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xa8d4ff,0.35);
fill.position.set(-20,15,-16);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffe8c0,0.28);
rim.position.set(12,9,-20);scene.add(rim);
const amb=new THREE.AmbientLight(0x355070,0.12);scene.add(amb);

/* TEXTURES */
function makeTexture(draw,size=512){
const c=document.createElement('canvas');c.width=c.height=size;
draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);
t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;}
const TEX={
grass:makeTexture((x,s)=>{
x.fillStyle='#2e5522';x.fillRect(0,0,s,s);
for(let i=0;i<8000;i++){const px=Math.random()*s,py=Math.random()*s;
const r=Math.random()*2.4+.5,l=Math.random();
x.fillStyle=l>.74?'rgba(130,186,74,.5)':l>.42?'rgba(64,112,44,.5)':'rgba(26,54,20,.5)';
x.beginPath();x.ellipse(px,py,r,r*1.7,Math.random()*Math.PI,0,TAU);x.fill();}}),
sand:makeTexture((x,s)=>{
x.fillStyle='#d4b070';x.fillRect(0,0,s,s);
for(let i=0;i<10000;i++){const l=Math.random();
x.fillStyle=l>.7?'rgba(240,215,160,.5)':l>.3?'rgba(190,150,95,.4)':'rgba(160,120,75,.4)';
x.fillRect(Math.random()*s,Math.random()*s,1.6,1.6);}}),
wood:makeTexture((x,s)=>{
x.fillStyle='#8a5a3a';x.fillRect(0,0,s,s);const plank=42;
for(let py=0;py<s;py+=plank){const sh=20+Math.random()*30;
x.fillStyle=`rgb(${140+sh|0},${90+sh*.6|0},${55+sh*.4|0})`;
x.fillRect(0,py,s,plank-2);
x.fillStyle='rgba(30,15,8,.6)';x.fillRect(0,py+plank-3,s,3);}}),
metal:makeTexture((x,s)=>{
x.fillStyle='#2a3a5a';x.fillRect(0,0,s,s);
for(let i=0;i<2000;i++){x.fillStyle=`rgba(${180+Math.random()*60|0},${200+Math.random()*40|0},255,.08)`;
x.fillRect(Math.random()*s,Math.random()*s,1.4,1.4);}}),
scorched:makeTexture((x,s)=>{
x.fillStyle='#3a2018';x.fillRect(0,0,s,s);
for(let i=0;i<6000;i++){const l=Math.random();
x.fillStyle=l>.7?'rgba(120,60,30,.5)':l>.3?'rgba(60,30,15,.5)':'rgba(20,10,5,.6)';
x.beginPath();x.arc(Math.random()*s,Math.random()*s,Math.random()*3+.5,0,TAU);x.fill();}})
};
TEX.grass.repeat.set(48,48);TEX.sand.repeat.set(42,42);
TEX.wood.repeat.set(24,24);TEX.metal.repeat.set(6,6);TEX.scorched.repeat.set(30,30);

/* GROUND/OCEAN */
const ground=new THREE.Mesh(new THREE.CircleGeometry(200,96),
new THREE.MeshStandardMaterial({map:TEX.grass,roughness:.96,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const oceanUniforms={uTime:{value:0},
uColorDeep:{value:new THREE.Color(0x052a4a)},
uColorShallow:{value:new THREE.Color(0x2d9ad4)},
uSunDir:{value:SUN_DIR.clone()}};
const oceanMat=new THREE.ShaderMaterial({
transparent:true,side:THREE.DoubleSide,fog:false,uniforms:oceanUniforms,
vertexShader:`varying vec3 vPos;varying float vWave;uniform float uTime;
void main(){vec3 p=position;
float w1=sin(p.x*0.12+uTime*.8)*.6;float w2=sin(p.y*0.18+uTime*1.1)*.4;
float w3=sin((p.x+p.y)*0.09+uTime*.6)*.3;p.z+=w1+w2+w3;
vWave=(w1+w2+w3)*0.4+0.5;vPos=p;
gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
fragmentShader:`varying vec3 vPos;varying float vWave;
uniform float uTime;uniform vec3 uColorDeep,uColorShallow,uSunDir;
void main(){vec3 d=normalize(vPos);
float h=clamp(d.y*.5+.5,0.,1.);
vec3 col=mix(uColorDeep,uColorShallow,h+vWave*.2);
float sun=max(dot(d,normalize(uSunDir)),0.);
col+=vec3(1.,.9,.65)*pow(sun,80.)*1.2;
float rip=sin(vPos.x*.35+uTime*1.6)*sin(vPos.z*.4+uTime*1.3);
col+=rip*.04;col+=vec3(pow(max(0.,rip),8.)*.35);
gl_FragColor=vec4(col,.92+vWave*.06);}`});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600,80,80),oceanMat);
ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.5;ocean.visible=false;scene.add(ocean);

/* GRASS */
function makeGrassMaterial(){
const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,side:THREE.DoubleSide});
m.onBeforeCompile=(sh)=>{sh.uniforms.uTime=uTime;
sh.vertexShader=sh.vertexShader.replace('#include <common>',`#include <common>
uniform float uTime;varying float vH;varying float vTint;`)
.replace('#include <begin_vertex>',`#include <begin_vertex>
vec3 iPos=vec3(0.0);#ifdef USE_INSTANCING
iPos=instanceMatrix[3].xyz;#endif
float ph=iPos.x*0.63+iPos.z*0.41;
vH=clamp(transformed.y/0.8,0.0,1.0);
vTint=fract(sin(ph*12.9898)*43758.5453);
float sway=sin(uTime*1.6+ph)*0.55+sin(uTime*3.4+ph*1.9)*0.22;
float bend=pow(vH,1.6);transformed.x+=sway*bend*0.34;transformed.z+=sway*bend*0.17;`);
sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
varying float vH;varying float vTint;`)
.replace('#include <color_fragment>',`#include <color_fragment>
float t=clamp(vH*.85+vTint*.3,0.,1.);
vec3 gc=mix(vec3(.045,.125,.03),vec3(.34,.7,.155),t);
gc*=mix(.85,1.15,vTint);diffuseColor.rgb*=gc;`);};
return m;}
let grassMesh=null;
function buildGrass(count,radius){
if(grassMesh){scene.remove(grassMesh);grassMesh.geometry.dispose();
grassMesh.material.dispose();grassMesh=null;}
if(count<=0)return;
const geo=new THREE.PlaneGeometry(.11,.8,1,3);geo.translate(0,.4,0);
grassMesh=new THREE.InstancedMesh(geo,makeGrassMaterial(),count);
const d=new THREE.Object3D();
for(let i=0;i<count;i++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*radius;
d.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
d.rotation.set(rand(-.12,.12),Math.random()*TAU,rand(-.12,.12));
const s=rand(.75,1.35);d.scale.set(s,rand(.7,1.7),s);
d.updateMatrix();grassMesh.setMatrixAt(i,d.matrix);}
grassMesh.instanceMatrix.needsUpdate=true;scene.add(grassMesh);}

/* FIREFLIES */
let fireflies=null,ffBase=null;
function buildFireflies(count){
if(fireflies){scene.remove(fireflies);fireflies.geometry.dispose();
fireflies.material.dispose();fireflies=null;}
if(count<=0)return;
const pos=new Float32Array(count*3);ffBase=new Float32Array(count*3);
for(let i=0;i<count;i++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*40;
const x=Math.cos(a)*r,z=Math.sin(a)*r,y=rand(.6,10);
pos[i*3]=ffBase[i*3]=x;pos[i*3+1]=ffBase[i*3+1]=y;pos[i*3+2]=ffBase[i*3+2]=z;}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const mat=new THREE.PointsMaterial({size:.38,map:radialTexture('rgba(255,250,200,1)'),
transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.55,
sizeAttenuation:true,fog:false,color:0xfff0a0});
fireflies=new THREE.Points(geo,mat);fireflies.frustumCulled=false;scene.add(fireflies);}

/* CLOUDS */
const cloudGroup=new THREE.Group();scene.add(cloudGroup);
function buildClouds(count){
while(cloudGroup.children.length>0){const c=cloudGroup.children.pop();c.material?.dispose?.();}
if(count<=0)return;
const cloudTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;
const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);
g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(0.4,'rgba(250,250,255,.65)');
g.addColorStop(1,'rgba(240,240,255,0)');x.fillStyle=g;x.fillRect(0,0,256,256);
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
for(let i=0;i<count;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({
map:cloudTex,color:0xffffff,transparent:true,blending:THREE.NormalBlending,
depthWrite:false,fog:false,opacity:rand(.3,.65)}));
const a=Math.random()*TAU,r=rand(80,200),y=rand(55,110);
s.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
const sc=rand(60,130);s.scale.set(sc,sc*.6,1);
s.userData.speed=rand(.15,.5)*(Math.random()<.5?1:-1);
s.userData.baseX=s.position.x;cloudGroup.add(s);}}

/* MAP/SHOP/PLAYER */
const mapGroup=new THREE.Group();scene.add(mapGroup);
const SHOP_POS=new THREE.Vector3(0,0,-12);
const shopGroup=new THREE.Group();scene.add(shopGroup);

const player=new THREE.Group();scene.add(player);
const heroMat=new THREE.MeshStandardMaterial({color:0x3ec9ff,emissive:0x0a6ba8,
emissiveIntensity:.45,roughness:.25,metalness:.4});
const bodyMesh=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.62,10,24),heroMat);
bodyMesh.position.y=.82;bodyMesh.castShadow=true;player.add(bodyMesh);
const visor=new THREE.Mesh(new THREE.SphereGeometry(.5,20,14,0,TAU,0,Math.PI/2.2),
new THREE.MeshStandardMaterial({color:0x1a2244,emissive:0x0a6ba8,
emissiveIntensity:.35,roughness:.25,metalness:.7}));
visor.position.y=1.08;visor.scale.set(1,.9,1);player.add(visor);
const visorLine=new THREE.Mesh(new THREE.TorusGeometry(.38,.04,6,24,Math.PI),
new THREE.MeshStandardMaterial({color:0x67e8f9,emissive:0x22d3ee,emissiveIntensity:1.2}));
visorLine.rotation.x=Math.PI/2;visorLine.position.y=1.08;player.add(visorLine);
const scarf=new THREE.Mesh(new THREE.TorusGeometry(.36,.075,8,20),
new THREE.MeshStandardMaterial({color:0x8b5cf6,emissive:0x6d28d9,
emissiveIntensity:.7,roughness:.4}));
scarf.position.y=.62;scarf.rotation.x=Math.PI/2;player.add(scarf);
const eyeW=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.1});
const eyeD=new THREE.MeshStandardMaterial({color:0x081120,roughness:.15});
for(const sx of[-1,1]){
const e=new THREE.Mesh(new THREE.SphereGeometry(.12,14,14),eyeW);
e.position.set(.16*sx,1.06,.35);player.add(e);
const p=new THREE.Mesh(new THREE.SphereGeometry(.058,12,12),eyeD);
p.position.set(.16*sx,1.06,.43);player.add(p);

const aura=new THREE.Mesh(new THREE.RingGeometry(.55,.92,40),

aura.rotation.x=-Math.PI/2;aura.position.y=.04;player.add(aura);
const gunHolder=new THREE.Group();gunHolder.position.set(.55,.95,.25);player.add(gunHolder);

function applyCharacter(ch){
if(!ch)return;
currentChar=ch;
heroMat.color.setHex(ch.color);
heroMat.emissive.setHex(ch.emissive);
heroMat.emissiveIntensity=.4;
if(scarf.material){scarf.material.color.setHex(ch.scarf);scarf.material.emissive.setHex(ch.scarf);scarf.material.emissiveIntensity=.6;}

}

/* COMMON */
const gems=[],enemies=[],particles=[],projectiles=[],explosions=[];
const gemGeo=new THREE.OctahedronGeometry(.42,0);
const gemShellGeo=new THREE.OctahedronGeometry(.62,0);
const enemyCoreGeo=new THREE.IcosahedronGeometry(.62,0);
const enemyShellGeo=new THREE.IcosahedronGeometry(.92,0);
const particleGeo=new THREE.SphereGeometry(.09,6,5);
const bulletGeo=new THREE.SphereGeometry(.13,6,6);

function buildHorde(){
const group=new THREE.Group();
skyUniforms.uSpace.value=0;skyUniforms.uNebula.value=0;
skyUniforms.topColor.value.setHex(0x0a1a2a);
skyUniforms.midColor.value.setHex(0x1a3a5a);
skyUniforms.horizon.value.setHex(0x2a5080);
sunGlow.visible=true;sunGlow.scale.setScalar(90);
if(grassMesh)grassMesh.visible=false;
ground.visible=true;ground.material.map=TEX.metal;
ground.material.color.setHex(0x1a2a3a);ground.material.needsUpdate=true;
ocean.visible=false;
scene.fog.color.setHex(0x0a1525);scene.fog.density=.008;
hemi.intensity=.6;sun.intensity=1.4;

const ARENA_TD=48;
// large dark arena floor already via ground

// winding path points (from spawn to orb)
const pathPts=[
new THREE.Vector3(-20,0,-20),
new THREE.Vector3(-10,0,-18),
new THREE.Vector3(-8,0,-8),
new THREE.Vector3(5,0,-10),
new THREE.Vector3(12,0,-2),
new THREE.Vector3(8,0,8),
new THREE.Vector3(-2,0,12),
new THREE.Vector3(-12,0,8),
new THREE.Vector3(-8,0,0),
new THREE.Vector3(0,0,-4),
new THREE.Vector3(0,0,0) // orb
];
const pathCurve=new THREE.CatmullRomCurve3(pathPts,false);
// path visual
const pathGeo=new THREE.TubeGeometry(pathCurve,80,1.8,8,false);
const pathMesh=new THREE.Mesh(pathGeo,new THREE.MeshStandardMaterial({
color:0x3a5a7a,roughness:.8,metalness:.2,emissive:0x112233,emissiveIntensity:.3}));
pathMesh.position.y=.05;group.add(pathMesh);

// magic orb at end
const orb=new THREE.Mesh(new THREE.SphereGeometry(1.4,20,16),
new THREE.MeshStandardMaterial({color:0x66eeff,emissive:0x22aadd,emissiveIntensity:1.5,roughness:.2,metalness:.6}));
orb.position.set(0,1.5,0);group.add(orb);
const orbRing=new THREE.Mesh(new THREE.TorusGeometry(2.2,.12,8,32),
new THREE.MeshBasicMaterial({color:0x66eeff,transparent:true,opacity:.6}));
orbRing.rotation.x=Math.PI/2;orbRing.position.y=.1;group.add(orbRing);
let orbHp=100;

// turret types
const TURRETS=[
{id:'gun',name:'پدافند تکی',icon:'🔫',price:30,range:9,dmg:25,rate:.45,color:0x88ccff},
{id:'multi',name:'مسلسل',icon:'🌀',price:60,range:8,dmg:12,rate:.12,color:0xa78bfa},
{id:'cannon',name:'توپخانه',icon:'💣',price:90,range:12,dmg:80,rate:1.1,color:0xff6644},
{id:'laser',name:'لیزر',icon:'⚡',price:120,range:14,dmg:40,rate:.25,color:0xff66ff},
{id:'aa',name:'پدافند هوایی',icon:'🚀',price:150,range:16,dmg:55,rate:.5,color:0x22d3ee}
];
const placed=[];
let selectedTurret=0;
let wave=0,waveTimer=3,spawnLeft=0,spawnCD=0;
let tdScore=80; // starting money
score=Math.max(score,80); // ensure can place first turret

// place zones (near path)
const zones=[];
for(let i=0;i<pathPts.length-1;i++){
const a=pathPts[i],b=pathPts[i+1];
const mx=(a.x+b.x)/2,mz=(a.z+b.z)/2;
// offset perpendicular
const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz)||1;
const px=-dz/len*3.5,pz=dx/len*3.5;
zones.push({x:mx+px,z:mz+pz});
zones.push({x:mx-px,z:mz-pz});}

// zone markers
for(const z of zones){
const m=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.15,12),
new THREE.MeshStandardMaterial({color:0x335566,emissive:0x224455,emissiveIntensity:.4,transparent:true,opacity:.7}));
m.position.set(z.x,.08,z.z);group.add(m);
z.marker=m;z.used=false;}

// enemy types
const ENEMY_TYPES=[
{hp:40,speed:3.2,color:0xff3355,reward:8,name:'سریع'},
{hp:90,speed:2.0,color:0xffaa22,reward:14,name:'تانک'},
{hp:55,speed:2.6,color:0xaa66ff,reward:11,name:'جادوگر'},
{hp:120,speed:1.5,color:0x44ff88,reward:20,name:'زره‌دار'},
{hp:30,speed:4.0,color:0x66eeff,reward:6,name:'اسکات'}
];

const tdEnemies=[];
function spawnTdEnemy(typeIdx){
const et=ENEMY_TYPES[typeIdx%ENEMY_TYPES.length];
const g=new THREE.Group();
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,0),
new THREE.MeshStandardMaterial({color:et.color,emissive:et.color,emissiveIntensity:1.2,flatShading:true}));
core.castShadow=true;g.add(core);
g.position.copy(pathPts[0]);g.position.y=1;
g.userData={t:0,hp:et.hp*(1+wave*.15),maxHp:et.hp*(1+wave*.15),speed:et.speed,reward:et.reward,color:et.color,core};
scene.add(g);tdEnemies.push(g);}

function placeTurretAt(zx,zz){
const def=TURRETS[selectedTurret];
if(score<def.price){showToast('امتیاز کافی نیست');return false;}
const zone=zones.find(z=>!z.used&&Math.hypot(z.x-zx,z.z-zz)<2.5);
if(!zone){showToast('اینجا نمی‌شود');return false;}
score-=def.price;updateHUD();
zone.used=true;zone.marker.material.color.setHex(0x225533);
const g=new THREE.Group();
const base=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,.4,10),
new THREE.MeshStandardMaterial({color:0x334455,metalness:.6,roughness:.3}));
base.position.y=.2;g.add(base);
const head=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.9),
new THREE.MeshStandardMaterial({color:def.color,emissive:def.color,emissiveIntensity:.7,metalness:.5}));
head.position.y=.7;g.add(head);
g.position.set(zone.x,0,zone.z);
g.userData={def,cooldown:0,head};
group.add(g);placed.push(g);
showToast(def.name+' نصب شد');
tone(660,.1,'triangle',.05);
return true;}

// tap/click to place — use fire button or near zone
let placeArmed=false;

function update(dt,t){
orb.rotation.y+=dt*.8;
orbRing.rotation.z+=dt*.5;
orb.material.emissiveIntensity=1.2+Math.sin(t*3)*.4;

// wave management
waveTimer-=dt;
if(waveTimer<=0&&spawnLeft<=0&&tdEnemies.length===0){
wave++;spawnLeft=5+wave*3;spawnCD=0;
waveTimer=999;showToast('موج '+wave);
if(wave%3===0)showToast('دشمنان قوی‌تر شدند!');}
if(spawnLeft>0){
spawnCD-=dt;
if(spawnCD<=0){spawnLeft--;spawnCD=Math.max(.35,1.1-wave*.04);
spawnTdEnemy(Math.floor(Math.random()*Math.min(5,1+Math.floor(wave/2))));}}

// move enemies along path
for(let i=tdEnemies.length-1;i>=0;i--){
const e=tdEnemies[i],u=e.userData;
u.t+=u.speed*dt*.012;
if(u.t>=1){
// reached orb
orbHp-=12;tdEnemies.splice(i,1);scene.remove(e);
burst(orb.position.clone(),0xff3366,16,1);
camShake=1;flash();
if(orbHp<=0){showToast('گوی نابود شد!');triggerGameOver();}
continue;}
const p=pathCurve.getPointAt(Math.min(.999,u.t));
e.position.set(p.x,1+Math.sin(t*5+i)*.1,p.z);
u.core.rotation.x+=dt*2;u.core.rotation.y+=dt*2.5;
// health via scale
const hr=u.hp/u.maxHp;
e.scale.setScalar(.7+.3*hr);}

// turrets shoot
for(const tr of placed){
const u=tr.userData;u.cooldown-=dt;
if(u.cooldown>0)continue;
let target=null,td=u.def.range;
for(const e of tdEnemies){
const d=tr.position.distanceTo(e.position);
if(d<td){td=d;target=e;}}
if(target){
u.cooldown=u.def.rate;
// aim
const dir=tmpA.subVectors(target.position,tr.position).setY(0).normalize();
u.head.rotation.y=Math.atan2(dir.x,dir.z);
// damage
target.userData.hp-=u.def.dmg;
burst(target.position.clone(),u.def.color,6,.4);
tone(400,.04,'square',.03);
if(target.userData.hp<=0){
score+=target.userData.reward;updateHUD();
burst(target.position.clone(),0xff3366,14,1);
scene.remove(target);
tdEnemies.splice(tdEnemies.indexOf(target),1);
// wave clear bonus
if(tdEnemies.length===0&&spawnLeft<=0){
waveTimer=4;score+=20+wave*5;updateHUD();showToast('موج پاک شد! +امتیاز');}
}}
}

// place turret: when player near unused zone and presses fire
if(isFiring&&state==='playing'){
for(const z of zones){
if(!z.used&&Math.hypot(player.position.x-z.x,player.position.z-z.z)<2.8){
placeTurretAt(z.x,z.z);isFiring=false;break;}}}

// cycle turret type with jump when near any zone
// (optional: show selected in toast occasionally)
}

function cleanup(){
for(const e of tdEnemies){scene.remove(e);e.traverse(o=>o.material?.dispose?.());}
tdEnemies.length=0;}

// give starting score for first turret
setTimeout(()=>{if(score<40){score=80;updateHUD();showToast('امتیاز اولیه برای پدافند');}},200);

return {group,groundY:()=>0,update,cleanup,name:'towerdefense',
noEnemies:true,noShop:true,
enemyColor:0xff3355,enemyColor2:0xff6688,
fallY:-5};
}

const blocks=[];

const wallMatRight=new THREE.MeshStandardMaterial({

function makeRow(){
const row=new THREE.Group();
row.position.set(0,0,SPAWN_Z);
const segments=[];
const W=PLAT_W-.8;
const pattern=Math.floor(Math.random()*8);

if(pattern===0){
const h=1.35;
const m=new THREE.Mesh(new THREE.BoxGeometry(W,h,ROW_DEPTH),lowMat);
m.position.y=h/2;m.castShadow=true;m.receiveShadow=true;row.add(m);
segments.push({xMin:-W/2,xMax:W/2,h});}
else if(pattern===1){
const h=2.9,bw=W*.58;
const m=new THREE.Mesh(new THREE.BoxGeometry(bw,h,ROW_DEPTH),wallMatLeft);
m.position.set(-W/2+bw/2,h/2,0);
m.castShadow=true;m.receiveShadow=true;row.add(m);
segments.push({xMin:-W/2,xMax:-W/2+bw,h});}
else if(pattern===2){
const h=2.9,bw=W*.58;
const m=new THREE.Mesh(new THREE.BoxGeometry(bw,h,ROW_DEPTH),wallMatRight);
m.position.set(W/2-bw/2,h/2,0);
m.castShadow=true;m.receiveShadow=true;row.add(m);
segments.push({xMin:W/2-bw,xMax:W/2,h});}
else if(pattern===3){
const h=2.9,bw=W*.42;
const m=new THREE.Mesh(new THREE.BoxGeometry(bw,h,ROW_DEPTH),pillarMat);
m.position.set(0,h/2,0);
m.castShadow=true;m.receiveShadow=true;row.add(m);
segments.push({xMin:-bw/2,xMax:bw/2,h});}
else if(pattern===4){
const h=2.9,bw=W*.36;
const left=new THREE.Mesh(new THREE.BoxGeometry(bw,h,ROW_DEPTH),wallMatLeft);
left.position.set(-W/2+bw/2,h/2,0);left.castShadow=true;row.add(left);
const right=new THREE.Mesh(new THREE.BoxGeometry(bw,h,ROW_DEPTH),wallMatRight);
right.position.set(W/2-bw/2,h/2,0);right.castShadow=true;row.add(right);
segments.push({xMin:-W/2,xMax:-W/2+bw,h});
segments.push({xMin:W/2-bw,xMax:W/2,h});}
else{
const h=2.9;
const gapW=3.2;
const gapX=rand(-W/2+gapW,W/2-gapW);
const leftW=(gapX-gapW/2)-(-W/2);
if(leftW>.2){
const left=new THREE.Mesh(new THREE.BoxGeometry(leftW,h,ROW_DEPTH),fullMat);
left.position.set(-W/2+leftW/2,h/2,0);
left.castShadow=true;row.add(left);
segments.push({xMin:-W/2,xMax:-W/2+leftW,h});}
const rightW=(W/2)-(gapX+gapW/2);
if(rightW>.2){
const right=new THREE.Mesh(new THREE.BoxGeometry(rightW,h,ROW_DEPTH),fullMat);
right.position.set(W/2-rightW/2,h/2,0);
right.castShadow=true;row.add(right);
segments.push({xMin:W/2-rightW,xMax:W/2,h});}}

/* Warning indicator */
const indicator=new THREE.Mesh(
new THREE.PlaneGeometry(W+1,.25),
new THREE.MeshBasicMaterial({
color:0xffffff,transparent:true,opacity:.5,
blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
indicator.rotation.x=-Math.PI/2;
indicator.position.set(0,.12,-ROW_DEPTH);
row.add(indicator);

/* Decorative top glow */
row.traverse(o=>{
if(o.isMesh&&o.geometry&&o.geometry.type==='BoxGeometry'){
const edges=new THREE.LineSegments(
new THREE.EdgesGeometry(o.geometry),
new THREE.LineBasicMaterial({color:0xffffff,fog:false}));
edges.position.copy(o.position);
row.add(edges);}});

group.add(row);
blocks.push({mesh:row,segments,resolved:false,passed:false,indicator});}

function groundY(x,z){
if(Math.abs(x)>PLAT_W/2-.3)return -Infinity;
if(z>18||z<-PLAT_L+30)return -Infinity;
return 0;}

let passed=0;
let nearMissCombo=0;
let nearMissTimer=0;
function update(dt,t){
spawnTimer+=dt;
const spawnInterval=Math.max(.85,1.5-level*.04);
if(spawnTimer>spawnInterval){
spawnTimer=0;
/* Ensure no overlap: only spawn if last row is far enough */
const lastZ=blocks.length?blocks[blocks.length-1].mesh.position.z:999;
if(lastZ>SPAWN_Z+8){
makeRow();}
}

const speed=16+level*1.0;
for(let i=blocks.length-1;i>=0;i--){
const b=blocks[i];
b.mesh.position.z+=speed*dt;
/* Pulse indicator */
if(b.indicator){
b.indicator.material.opacity=.3+Math.sin(t*15)*.25;}

const dz=b.mesh.position.z-player.position.z;
if(!b.resolved&&Math.abs(dz)<ROW_DEPTH*.7){
const px=player.position.x,py=player.position.y;
for(const seg of b.segments){
if(px>seg.xMin-.3&&px<seg.xMax+.3){
if(py<seg.h-.35){
b.resolved=true;
if(invuln<=0&&!isFalling){
invuln=1.6;camShake=1.4;
lives--;updateHUD();flash();
tone(140,.35,'sawtooth',.11,50);
burst(player.position.clone().setY(1),0xff3b5c,16);
player.position.z=Math.min(player.position.z,b.mesh.position.z-3);
nearMissCombo=0;
if(lives<=0)triggerGameOver();}
break;}}}}

/* Near-miss combo */
if(!b.passed&&dz>-ROW_DEPTH&&dz<0.2&&b.resolved===false){
const px=player.position.x;
let nearMiss=false;
for(const seg of b.segments){
if(px>seg.xMin-.3&&px<seg.xMax+.3&&seg.h>1.5){
nearMiss=true;break;}}
if(!nearMiss){nearMissCombo++;nearMissTimer=3;
showCombo(nearMissCombo);score+=5+nearMissCombo*2;
updateHUD();}}

if(!b.passed&&dz>2.5){
b.passed=true;passed++;score+=3;updateHUD();
if(passed%25===0){
level++;showToast('مرحله '+level);
chord([659,880,1046],.3,.055);}}
if(b.mesh.position.z>RECYCLE_Z){
group.remove(b.mesh);
b.mesh.traverse(o=>o.geometry?.dispose?.());
blocks.splice(i,1);}}

/* Combo timer */
if(nearMissTimer>0){nearMissTimer-=dt;
if(nearMissTimer<=0){nearMissCombo=0;hideCombo();}}

/* Animate decorations */
stars.rotation.y+=dt*.008;
stars.rotation.x+=dt*.003;
for(const c of group.children){
if(c.userData.spin)c.rotation.y+=dt*c.userData.spin;}
/* Pulse rails */
const railPulse=.85+Math.sin(t*3)*.15;
railMats.forEach(m=>{m.color.setHSL(.52,1,.55+Math.sin(t*4)*.15);});
/* Pulse center strip */
pulseStrip.material.opacity=.4+Math.sin(t*6)*.2;
/* Pole lights flicker */
for(const pl of poleLights){
pl.mat.emissiveIntensity=2+Math.sin(t*8+pl.light.position.z)*.8;}}

function cleanup(){
for(const b of blocks){
group.remove(b.mesh);
b.mesh.traverse(o=>o.geometry?.dispose?.());}
blocks.length=0;}

return {
group,groundY,update,cleanup,
name:'blockdash',
fallY:-4,
camConfig:{behind:true,dist:13,height:5.5,lookAhead:6},
noShop:true,
enemyColor:0x22ccff,enemyColor2:0xff3366};}

function buildSkyFall(){

skyUniforms.uSpace.value=0;skyUniforms.uNebula.value=1;

ring.rotation.x=Math.PI/2;ring.position.y=.1;group.add(ring);

for(let i=0;i<16;i++){
const a=(i/16)*TAU;
const ph=rand(4,9);
const pillar=new THREE.Mesh(

pillar.castShadow=true;group.add(pillar);
const top=new THREE.Mesh(new THREE.SphereGeometry(.4,8,6),
new THREE.MeshStandardMaterial({color:0xff5522,emissive:0xff2200,

pl.position.set(Math.cos(a)*(R+3),ph+.2,Math.sin(a)*(R+3));

const falls=[];
let spawnTimer=0;
const blockMats=[
new THREE.MeshStandardMaterial({color:0x8a4a2a,roughness:.9,metalness:.1,
emissive:0x551100,emissiveIntensity:.4}),
new THREE.MeshStandardMaterial({color:0x5a3a2a,roughness:.85,metalness:.15,
emissive:0x442200,emissiveIntensity:.4}),
new THREE.MeshStandardMaterial({color:0x6a2a1a,roughness:.9,metalness:.1,
emissive:0x661100,emissiveIntensity:.5})];

function spawnFall(){
if(falls.length>=12)return; // hard limit to prevent lag
const a=Math.random()*TAU;
const r=Math.sqrt(Math.random())*(R-3);
const x=Math.cos(a)*r,z=Math.sin(a)*r;
if(Math.hypot(x-player.position.x,z-player.position.z)<2.8)return;
const roll=Math.random();
let size,warnTime,dmgMul;
if(roll<.6){size=rand(1.15,1.55);warnTime=1.4;dmgMul=1;}
else if(roll<.88){size=rand(1.7,2.2);warnTime=1.7;dmgMul=1.15;}
else{size=rand(2.4,3.1);warnTime=2.0;dmgMul=1.4;}

const warnMat=new THREE.MeshBasicMaterial({
color:0xff3322,transparent:true,opacity:.5,
side:THREE.DoubleSide,depthWrite:false,fog:false,
blending:THREE.AdditiveBlending});
const warn=new THREE.Mesh(new THREE.CircleGeometry(size*1.1,20),warnMat);
warn.rotation.x=-Math.PI/2;warn.position.set(x,.08,z);group.add(warn);

const wRingMat=new THREE.MeshBasicMaterial({
color:0xff5533,transparent:true,opacity:.85,
side:THREE.DoubleSide,depthWrite:false,fog:false});
const wRing=new THREE.Mesh(new THREE.RingGeometry(size*1.0,size*1.25,20),wRingMat);
wRing.rotation.x=-Math.PI/2;wRing.position.set(x,.1,z);group.add(wRing);

const shadowMat=new THREE.MeshBasicMaterial({
color:0x000000,transparent:true,opacity:.18,
side:THREE.DoubleSide,depthWrite:false,fog:false});
const shadow=new THREE.Mesh(new THREE.CircleGeometry(size*.9,16),shadowMat);
shadow.rotation.x=-Math.PI/2;shadow.position.set(x,.05,z);group.add(shadow);

const blockMat=blockMats[Math.floor(Math.random()*blockMats.length)].clone();
blockMat.emissive=new THREE.Color(0xff3300);
blockMat.emissiveIntensity=.35;
const blockMesh=new THREE.Mesh(
new THREE.BoxGeometry(size*1.85,size*1.85,size*1.85),blockMat);
blockMesh.position.set(x,55,z);
blockMesh.castShadow=false; // big perf win
blockMesh.receiveShadow=false;
group.add(blockMesh);

falls.push({x,z,size,blockMesh,warn,wRing,shadow,
elapsed:0,warnTime,startY:55,currentY:55,
state:'warning',nearMissed:false,dmgMul,
spinSpeed:rand(1.2,2.8),spinDir:Math.random()<.5?1:-1});}

let comboLocal=0;
let comboTimerLocal=0;
let survivedCount=0;

function update(dt,t){
spawnTimer+=dt;
const baseInterval=Math.max(.75,1.6-level*.05);
if(spawnTimer>baseInterval&&falls.length<12){
spawnTimer=0;
const count=1+(Math.random()<.3&&level>3?1:0);
for(let i=0;i<count;i++)spawnFall();
}

for(let i=falls.length-1;i>=0;i--){
const f=falls[i];
f.elapsed+=dt;
if(f.state==='warning'){
const progress=clamp(f.elapsed/f.warnTime,0,1);
const pulse=.5+Math.sin(t*22+f.x)*.5;
f.warn.material.opacity=(.35+progress*.5)*pulse;
f.wRing.material.opacity=.6+progress*.4;
f.shadow.material.opacity=.15+progress*.55;
f.currentY=f.startY*(1-Math.pow(progress,1.6));
f.blockMesh.position.y=f.currentY;
f.blockMesh.rotation.x+=dt*f.spinSpeed*f.spinDir;
f.blockMesh.rotation.y+=dt*f.spinSpeed*.7*f.spinDir;

const dx=player.position.x-f.x;
const dz=player.position.z-f.z;
const d=Math.hypot(dx,dz);

if(!f.nearMissed&&d>f.size*1.1&&d<f.size*2.2&&player.position.y<2.5){
f.nearMissed=true;comboLocal++;comboTimerLocal=3;
score+=3;showCombo(comboLocal);updateHUD();
tone(660,.06,'sine',.05,990);}

if(invuln<=0&&!isFalling&&
f.currentY<player.position.y+1.6&&
d<f.size*1.05){
invuln=1.9;camShake=1.5;lives--;updateHUD();flash();
comboLocal=0;hideCombo();
noiseBurst(.25,.18);
tone(90,.4,'sawtooth',.14,40);
tmpA.set(dx,0,dz);
if(tmpA.lengthSq()<.001)tmpA.set(1,0,0);
tmpA.normalize();
player.position.addScaledVector(tmpA,f.size*2.2);
if(lives<=0)triggerGameOver();}

if(progress>=1){
f.state='impact';
f.blockMesh.position.y=0;
f.blockMesh.rotation.set(0,0,0);
survivedCount++;score+=5+comboLocal*2;updateHUD();
burst(new THREE.Vector3(f.x,.3,f.z),0xd4a070,10,.9);
burst(new THREE.Vector3(f.x,.3,f.z),0xffaa44,6,.7);
camShake=Math.max(camShake,.6+f.size*.1);
noiseBurst(.15,.1);tone(70,.3,'square',.08,35);

group.remove(f.warn);group.remove(f.wRing);group.remove(f.shadow);
f.warn.material.dispose();f.warn.geometry.dispose();
f.wRing.material.dispose();f.wRing.geometry.dispose();
f.shadow.material.dispose();f.shadow.geometry.dispose();

const crack=new THREE.Mesh(
new THREE.CircleGeometry(f.size*1.4,16),
new THREE.MeshBasicMaterial({color:0x1a0a05,transparent:true,opacity:.7,
side:THREE.DoubleSide,depthWrite:false}));
crack.rotation.x=-Math.PI/2;
crack.position.set(f.x,.06,f.z);
group.add(crack);f.crackMesh=crack;
f.shrinkTime=3.0;
if(survivedCount%10===0){level++;showToast('مرحله '+level);
chord([659,880,1046],.3,.055);}}
else if(f.state==='impact'){
f.shrinkTime-=dt;
const s=Math.max(0,f.shrinkTime/3.0);
const eased=s*s;
f.blockMesh.scale.setScalar(eased);
f.blockMesh.position.y=-f.size*(1-eased)*.5;
if(f.crackMesh)f.crackMesh.material.opacity=.7*s;
if(s<=0){
group.remove(f.blockMesh);
f.blockMesh.traverse(o=>{o.geometry?.dispose?.();o.material?.dispose?.();});
if(f.crackMesh){group.remove(f.crackMesh);
f.crackMesh.geometry.dispose();f.crackMesh.material.dispose();}
falls.splice(i,1);}}}}

if(comboTimerLocal>0){comboTimerLocal-=dt;
if(comboTimerLocal<=0){comboLocal=0;hideCombo();}}}

function groundY(x,z){
const r=Math.hypot(x,z);
if(r>R-1)return -Infinity;return 0;}
function cleanup(){
for(const f of falls){
group.remove(f.blockMesh);
f.blockMesh.traverse(o=>{o.geometry?.dispose?.();o.material?.dispose?.();});
if(f.warn){group.remove(f.warn);f.warn.geometry.dispose();f.warn.material.dispose();}
if(f.wRing){group.remove(f.wRing);f.wRing.geometry.dispose();f.wRing.material.dispose();}
if(f.shadow){group.remove(f.shadow);f.shadow.geometry.dispose();f.shadow.material.dispose();}
if(f.crackMesh){group.remove(f.crackMesh);
f.crackMesh.geometry.dispose();f.crackMesh.material.dispose();}}
falls.length=0;}

return {group,groundY,update,cleanup,name:'skyfall',
fallY:-5,noEnemies:true,
enemyColor:0xff5522,enemyColor2:0xffaa44};}

function explosion(pos,color,radius){

noiseBurst(.2,.15);tone(80,.35,'sawtooth',.12,40);
camShake=Math.max(camShake,1.5);
for(let i=enemies.length-1;i>=0;i--){

const dmg=320*(1-d/radius)+100;
e.userData.hp-=dmg;e.userData.flashT=1;

burst(e.position.clone(),0xff3366,28,1.4);
score+=15;updateHUD();

enemies.splice(i,1);}}}}

/* AUTO-DETECT */
let fpsSamples=[];
let autoAdjustCooldown=0;
let initialDetectDone=false;
let fpsUpdateTimer=0;

function autoDetectInitial(){
setQuality('ultra',true);
initialDetectDone=false;fpsSamples=[];
setTimeout(()=>{
if(fpsSamples.length<5){setQuality('ultra',true);initialDetectDone=true;return;}
const avg=fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
let chosen='ultra';
if(avg<22)chosen='low';else if(avg<32)chosen='medium';
else if(avg<45)chosen='high';else chosen='ultra';
setQuality(chosen,true);initialDetectDone=true;},1200);}

function trackFPS(dt){
if(dt>0&&dt<.5)fpsSamples.push(1/dt);
if(fpsSamples.length>30)fpsSamples.shift();
fpsUpdateTimer+=dt;
if(fpsUpdateTimer>.5){fpsUpdateTimer=0;
const avg=fpsSamples.length?fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length:0;
elFps.textContent=Math.round(avg)+' FPS';}
if(!initialDetectDone)return;
autoAdjustCooldown-=dt;if(autoAdjustCooldown>0)return;
if(fpsSamples.length<25)return;
const avg=fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
if(avg<20&&QUALITY.level!=='low'){
const next=QUALITY.level==='ultra'?'high':QUALITY.level==='high'?'medium':'low';
setQuality(next,true);autoAdjustCooldown=6;}
else if(avg<28&&QUALITY.level==='ultra'){setQuality('high',true);autoAdjustCooldown=5;}
else if(avg>55&&QUALITY.level==='low'){setQuality('medium',true);autoAdjustCooldown=8;}
else if(avg>55&&QUALITY.level==='medium'){setQuality('high',true);autoAdjustCooldown=10;}
else if(avg>62&&QUALITY.level==='high'){setQuality('ultra',true);autoAdjustCooldown=12;}}

/* UPDATE PLAYER */
function updatePlayer(dt,t){
if(shopOpen||state!=='playing'){
const bob=Math.abs(Math.sin(t*6))*.05;
bodyMesh.position.y=.82+bob;
aura.material.opacity=.3+Math.sin(t*4)*.12;
if(shopOpen){
const d=Math.hypot(player.position.x-SHOP_POS.x,player.position.z-SHOP_POS.z);
if(d>0.1){
const target=Math.atan2(SHOP_POS.x-player.position.x,SHOP_POS.z-player.position.z);
let diff=target-player.rotation.y;
diff=Math.atan2(Math.sin(diff),Math.cos(diff));
player.rotation.y+=diff*Math.min(1,6*dt);}}
return;}

let ix=0,iz=0;
if(keys['KeyW']||keys['ArrowUp'])iz-=1;
if(keys['KeyS']||keys['ArrowDown'])iz+=1;
if(keys['KeyA']||keys['ArrowLeft'])ix-=1;
if(keys['KeyD']||keys['ArrowRight'])ix+=1;
ix+=joy.x;iz+=joy.y;
const len=Math.hypot(ix,iz);
if(len>1){ix/=len;iz/=len;}

const isBlockDash=currentThemeKey==='blockdash';
let mx,mz;
if(isBlockDash){mx=ix;mz=iz;}
else{
const fwd=tmpA.set(-Math.sin(camYaw),0,-Math.cos(camYaw));
const right=tmpB.set(Math.cos(camYaw),0,-Math.sin(camYaw));
mx=fwd.x*(-iz)+right.x*ix;
mz=fwd.z*(-iz)+right.z*ix;}
const mlen=Math.hypot(mx,mz);
const SPEED=isBlockDash?12:10.5;
const tvx=mlen>.001?(mx/mlen)*SPEED*Math.min(1,mlen):0;
const tvz=mlen>.001?(mz/mlen)*SPEED*Math.min(1,mlen):0;
player.userData.vx=damp(player.userData.vx??0,tvx,12,dt);
player.userData.vz=damp(player.userData.vz??0,tvz,12,dt);
player.position.x+=player.userData.vx*dt;
player.position.z+=player.userData.vz*dt;
/* block walking through shop */
if(!currentMap.noShop){
const sdx=player.position.x-SHOP_POS.x,sdz=player.position.z-SHOP_POS.z;
const sdist=Math.hypot(sdx,sdz);
if(sdist<2.8&&sdist>0.01){
const push=(2.8-sdist)/sdist;
player.position.x+=sdx*push;player.position.z+=sdz*push;
player.userData.vx*=.3;player.userData.vz*=.3;}}

if(isBlockDash){
player.position.x=clamp(player.position.x,-7.2,7.2);
player.position.z=clamp(player.position.z,-8,6);}

const sp=Math.hypot(player.userData.vx,player.userData.vz);
if(sp>.4){
const target=Math.atan2(player.userData.vx,player.userData.vz);
let diff=target-player.rotation.y;
diff=Math.atan2(Math.sin(diff),Math.cos(diff));
player.rotation.y+=diff*Math.min(1,13*dt);}

coyote=onGround?.12:Math.max(0,coyote-dt);
jumpBuffer=Math.max(0,jumpBuffer-dt);
if(jumpBuffer>0&&coyote>0){
vy=isBlockDash?12:11;
onGround=false;coyote=0;jumpBuffer=0;landSquash=-.35;
tone(520,.13,'sine',.055,900);
burst(player.position.clone().setY(.15),0xbdf3ff,8,.4);}
if(!keys['Space']&&vy>3)vy-=22*dt;
vy-=28*dt;
const prevY=player.position.y;
player.position.y+=vy*dt;

const gY=currentMap.groundY(player.position.x,player.position.z,player.position.y+.3);
if(gY!==-Infinity&&player.position.y<=gY){
if(!onGround&&vy<-4&&prevY>gY){
landSquash=.45;
burst(player.position.clone().setY(gY+.1),0xd8f4ff,6,.3);}
player.position.y=gY;vy=0;onGround=true;}
else{onGround=false;}

if(!isBlockDash){
const r=Math.hypot(player.position.x,player.position.z);
if(r>ARENA+5){player.position.x*=(ARENA+5)/r;player.position.z*=(ARENA+5)/r;}}

if(currentMap.fallY&&player.position.y<currentMap.fallY&&!isFalling){
isFalling=true;fallOverlay.classList.add('on');
tone(180,.5,'sawtooth',.09,60);
setTimeout(()=>{
if(isBlockDash)player.position.set(0,1.5,0);
else if(currentThemeKey==='skyfall')player.position.set(0,2,0);
else player.position.set(0,4,5);
vy=0;isFalling=false;
lives--;updateHUD();flash();
fallOverlay.classList.remove('on');
burst(player.position.clone(),0x88ddff,16,.8);
if(lives<=0)triggerGameOver();
else showToast('سقوط!');},400);}

landSquash=damp(landSquash,0,9,dt);
const bob=sp>.5?Math.abs(Math.sin(t*12))*.09:0;
bodyMesh.position.y=.82+bob+landSquash*.4;
bodyMesh.scale.set(1+landSquash*.35,1-landSquash*.5,1+landSquash*.35);
scarf.rotation.z=t*2.2;
visorLine.rotation.z=Math.sin(t*1.5)*.05;
const pulse=.5+Math.sin(t*5)*.2;
aura.material.opacity=pulse;
aura.scale.setScalar(1+Math.sin(t*3)*.07);
recoilAmount=damp(recoilAmount,0,14,dt);
gunHolder.position.z=.25-recoilAmount*1.5;
gunHolder.rotation.x=-recoilAmount*1.2;
if(invuln>0){invuln-=dt;
player.visible=Math.floor(t*16)%2===0;
if(invuln<=0)player.visible=true;}}

/* UPDATE ENEMIES */
function updateEnemies(dt,t){
if(shopOpen||currentThemeKey==='blockdash'||state!=='playing')return;
if(currentMap.useIslandEnemies)return; /* handled by map */
if(currentMap.noEnemies)return;
for(let i=0;i<enemies.length;i++){
const e=enemies[i],u=e.userData;
let dx=player.position.x-e.position.x;
let dz=player.position.z-e.position.z;
const dist=Math.hypot(dx,dz)||1;
dx/=dist;dz/=dist;
let sx=0,sz=0;
for(let j=0;j<enemies.length;j++){
if(i===j)continue;const o=enemies[j];
const ox=e.position.x-o.position.x;
const oz=e.position.z-o.position.z;
const d2=ox*ox+oz*oz;
if(d2<4.4&&d2>.0001){const d=Math.sqrt(d2);
const w=(2.1-d)/2.1;sx+=(ox/d)*w;sz+=(oz/d)*w;}}
const tx=dx*u.speed+sx*7;
const tz=dz*u.speed+sz*7;
const k=1-Math.exp(-5*dt);
u.vel.x=lerp(u.vel.x,tx,k);u.vel.y=lerp(u.vel.y,tz,k);
const vl=Math.hypot(u.vel.x,u.vel.y);
const maxV=u.speed*1.35;
if(vl>maxV){u.vel.x*=maxV/vl;u.vel.y*=maxV/vl;}
e.position.x+=u.vel.x*dt;
e.position.z+=u.vel.y*dt;
const rr=Math.hypot(e.position.x,e.position.z);
if(rr>ARENA+1){e.position.x*=(ARENA+1)/rr;e.position.z*=(ARENA+1)/rr;}
const gy=currentMap.groundY(e.position.x,e.position.z,player.position.y+.3);
const baseY=gy===-Infinity?0:gy;
e.position.y=baseY+1.35+Math.sin(t*3+u.phase)*.32;
u.core.rotation.x+=dt*1.7;u.core.rotation.y+=dt*2.4;
u.shell.rotation.y-=dt*1.1;u.shell.rotation.z+=dt*.7;
if(u.flashT>0){
u.flashT=Math.max(0,u.flashT-dt*4);
const f=u.flashT;
u.core.material.emissiveIntensity=2.0+f*4;
u.core.material.color.setRGB(1,1-f*.5,1-f*.5);}
const hpRatio=u.hp/u.maxHp;
if(!u.healthBar){
const bg=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.12),
new THREE.MeshBasicMaterial({color:0x330011,depthWrite:false,fog:false}));
const fg=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.12),
new THREE.MeshBasicMaterial({color:0xff3366,depthWrite:false,fog:false}));
fg.position.z=.01;const grp=new THREE.Group();
grp.add(bg);grp.add(fg);e.add(grp);u.healthBar={grp,fg};}
u.healthBar.grp.position.y=1.7;
u.healthBar.grp.quaternion.copy(camera.quaternion);
u.healthBar.fg.scale.x=clamp(hpRatio,0,1);
u.healthBar.fg.position.x=-(1-hpRatio)*.55;
if(invuln<=0&&dist<1.55&&!isFalling)hitPlayer(e);}}

<div style="font-size:11px;color:${owned?'#34d399':'#fde047'}">${owned?(active?'✓ فعال':'انتخاب'):'💰 '+ch.price}</div>`;
btn.addEventListener('click',()=>{
if(owned){applyCharacter(ch);renderChars();showToast(ch.name+' انتخاب شد');}
else if(score>=ch.price){
score-=ch.price;ownedChars.add(ch.id);applyCharacter(ch);
updateHUD();renderChars();showToast(ch.name+' خریداری شد!');
tone(880,.15,'triangle',.07,1320);}
else showToast('امتیاز کافی نیست');
});
grid.appendChild(btn);});}


function openAbyssalBloom(){
const ov=document.getElementById('abyssalOverlay');
const fr=document.getElementById('abyssalFrame');
if(!ov||!fr){showToast('Abyssal در دسترس نیست');return;}
// pause main loop-ish
if(state==='playing')state='paused';
settingsModal.classList.remove('show');
// same folder sibling file
fr.src='abyssal_bloom.html';
ov.style.display='block';
showToast('Abyssal Bloom');
}
function closeAbyssalBloom(){
const ov=document.getElementById('abyssalOverlay');
const fr=document.getElementById('abyssalFrame');
if(fr)fr.src='about:blank';
if(ov)ov.style.display='none';
if(state==='paused')state='playing';
showToast('بازگشت به بازی اصلی');
}
document.getElementById('abyssalBack')?.addEventListener('click',closeAbyssalBloom);

function renderThemes(){
themeGrid.innerHTML='';
Object.keys(THEMES).forEach(key=>{
const t=THEMES[key];
const btn=document.createElement('button');
btn.className='themeBtn'+(currentThemeKey===key?' active':'');
btn.innerHTML=`<div class="swatch ${key}"></div><div>${t.name}</div>`;
btn.addEventListener('click',()=>{
try{
if(key==='abyssal'){
openAbyssalBloom();
return;
}
applyTheme(key);renderThemes();showToast(t.name);
}catch(err){showError(err);}});
themeGrid.appendChild(btn);});}
qualityGrid.querySelectorAll('.qualityBtn').forEach(btn=>{
btn.addEventListener('click',()=>{
setQuality(btn.dataset.q,false);
showToast('کیفیت: '+QUALITY_PROFILES[btn.dataset.q].name);});});

/* POST-PROCESSING */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.4,0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* CAMERA */
function updateCameraForViewport(){
const aspect=innerWidth/innerHeight;
if(aspect<1){camera.fov=68;camBaseDist=20;camHeightMul=.78;}
else if(aspect<1.4){camera.fov=62;camBaseDist=18;camHeightMul=.72;}
else{camera.fov=55;camBaseDist=17;camHeightMul=.68;}
camera.aspect=aspect;camera.updateProjectionMatrix();camDist=camBaseDist;}

function updateCamera(dt){
const isBlockDash=currentThemeKey==='blockdash';
const focus=state==='playing'?player.position:tmpV.set(0,1,0);
if(state==='idle')camYaw+=dt*.12;
if(isBlockDash){
const cfg=currentMap.camConfig||{dist:13,height:5.5,lookAhead:6};
const targetPos=tmpA.set(player.position.x*.5,
player.position.y+cfg.height,
player.position.z+cfg.dist);
camPos.lerp(targetPos,1-Math.exp(-6*dt));
camera.position.copy(camPos);
if(camShake>0){camShake=Math.max(0,camShake-dt*2.2);
const s=camShake*camShake*.55;
camera.position.x+=rand(-s,s);
camera.position.y+=rand(-s,s);
camera.position.z+=rand(-s,s);}
camLook.lerp(tmpB.set(player.position.x*.7,player.position.y+1.2,
player.position.z-cfg.lookAhead),1-Math.exp(-6*dt));
camera.lookAt(camLook);}
else{
const sp=state==='playing'?Math.hypot(player.userData.vx||0,player.userData.vz||0):0;
const wantDist=camBaseDist+sp*.28;
camDist=damp(camDist,wantDist,3,dt);
const target=tmpA.set(
focus.x+Math.sin(camYaw)*camDist,
focus.y+camDist*camHeightMul+2.2,
focus.z+Math.cos(camYaw)*camDist);
target.y=Math.max(target.y,2.5);
camPos.lerp(target,1-Math.exp(-6*dt));
camera.position.copy(camPos);
if(camShake>0){camShake=Math.max(0,camShake-dt*2.2);
const s=camShake*camShake*.55;
camera.position.x+=rand(-s,s);
camera.position.y+=rand(-s,s);
camera.position.z+=rand(-s,s);}
camLook.lerp(tmpB.set(focus.x,focus.y+1.25,focus.z),1-Math.exp(-7*dt));
camera.lookAt(camLook);}
sky.position.copy(camera.position);
sunGlow.position.copy(camera.position).addScaledVector(SUN_DIR,430);
sun.position.copy(camera.position).addScaledVector(SUN_DIR,46);
sun.target.position.copy(camera.position);
sun.target.updateMatrixWorld();
cloudGroup.position.set(camera.position.x,0,camera.position.z);}

/* MAIN LOOP */
const clock=new THREE.Clock();
let elapsed=0;

function animate(){
requestAnimationFrame(animate);
try{
const dt=Math.min(clock.getDelta(),.05);
elapsed+=dt;uTime.value=elapsed;
oceanUniforms.uTime.value=elapsed;
skyUniforms.uTime.value=elapsed;
trackFPS(dt);
if(state==='playing'){
updatePlayer(dt,elapsed);
updateGems(dt,elapsed);
updateEnemies(dt,elapsed);
tryFire(dt);
updateShopSystem(dt);
if(currentMap.update&&!shopOpen)currentMap.update(dt,elapsed);}
updateProjectiles(dt);
updateParticles(dt);
updateFireflies(elapsed);
updateClouds(dt);
for(let i=0;i<4;i++){
const g=shopGroup.userData['gun'+i];
if(g)g.rotation.y=Math.sin(elapsed*.9+i)*.5+i*.3;}
updateCamera(dt);
composer.render();}
catch(err){showError(err);}}
animate();

/* RESIZE */
function handleResize(){
const w=innerWidth,h=innerHeight;
camera.aspect=w/h;camera.updateProjectionMatrix();
renderer.setSize(w,h);composer.setSize(w,h);bloom.setSize(w,h);
updateCameraForViewport();}
addEventListener('resize',handleResize);
addEventListener('orientationchange',()=>setTimeout(handleResize,300));
if(screen.orientation){
screen.orientation.addEventListener('change',()=>setTimeout(handleResize,300));}

/* INIT */
try{
updateCameraForViewport();
buildFireflies(QUALITY.fireflyCount);
buildClouds(QUALITY.cloudCount);
applyTheme('meadow');
updateHUD();
updateQualityUI();
setTimeout(()=>{autoDetectInitial();beginGame();},100);
}catch(err){showError(err);}
</script>

<button id="abyssalBack" style="position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:102;padding:10px 16px;border-radius:12px;border:1.5px solid rgba(95,245,224,.4);background:rgba(5,26,36,.9);color:#5ff5e0;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer">← بازگشت به بازی اصلی</button>
<iframe id="abyssalFrame" style="width:100%;height:100%;border:0;background:#041822" allow="autoplay"></iframe>
</div>
