<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فرار از شهر فرش</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#d9c35a;
  --carpet:#9c8d3c;
  --ink:#16130a;
  --paper:#f3e8a6;
  --alarm:#e0402e;
  --ok:#8be05c;
  --panel:rgba(22,19,10,.85);
  --accent: #d9c35a;
  --f-body: 'Outfit', Tahoma, sans-serif;
  --f-mono: 'VT323', monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--f-body); }
#app { position: fixed; inset: 0; overflow: hidden; }
canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* HUD */
#hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; font-family: var(--f-mono); font-size: 26px; color: #fff6c8; text-shadow: 0 0 6px rgba(0,0,0,.8); padding: max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); direction: ltr; }
#hud .tl { position: absolute; top: max(12px,env(safe-area-inset-top)); left: max(16px,env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 2px; }
#rec { display: flex; align-items: center; gap: 8px; }
#rec i { width: 12px; height: 12px; border-radius: 50%; background: var(--alarm); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#obj { font-family: var(--f-body); font-size: 15px; font-weight: 700; margin-top: 6px; direction: inherit; }
#mini { position: absolute; top: max(12px,env(safe-area-inset-top)); right: max(16px,env(safe-area-inset-right)); width: 147px; height: 147px; background: rgba(10,8,2,.45); border: 2px solid rgba(243,232,166,.5); }
#stamWrap { position: absolute; left: 50%; bottom: max(18px,env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(260px,50vw); height: 8px; background: rgba(0,0,0,.45); border: 1px solid rgba(243,232,166,.6); }
#stam { height: 100%; width: 100%; background: var(--wall); transition: width 0.1s; }
#stam.low { background: var(--alarm); }
#toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); max-width: min(520px,90vw); text-align: center; font-family: var(--f-body); font-size: 18px; font-weight: 700; padding: 8px 16px; background: rgba(10,8,2,.7); border: 1px solid rgba(243,232,166,.5); opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.on { opacity: 1; }
#danger { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center,transparent 35%,rgba(150,10,0,.85) 100%); }
#fx { position: absolute; inset: 0; z-index: 7; pointer-events: none; display: none; overflow: hidden; }
#fx.on { display: block; background: repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(20,14,0,.55) 100%); }
#prompt { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); font-family: var(--f-body); font-size: 17px; font-weight: 700; padding: 6px 16px; background: rgba(10,8,2,.7); border: 1px solid var(--wall); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
#prompt.on { opacity: 1; }

/* Touch Controls */
#touch { position: absolute; inset: 0; z-index: 4; display: none; touch-action: none; }
body.touch #touch { display: block; }
.tbtn { position: absolute; z-index: 8; pointer-events: auto; display: none; width: 64px; height: 64px; border-radius: 50%; padding: 0; background: rgba(10,8,2,.5); border: 1px solid rgba(243,232,166,.6); color: var(--paper); font-family: var(--f-body); font-size: 13px; font-weight: 700; }
body.touch.ingame .tbtn { display: block; }
#bSprint { right: max(20px,env(safe-area-inset-right)); bottom: max(110px,env(safe-area-inset-bottom)); }
#bFlash { right: max(96px,env(safe-area-inset-right)); bottom: max(40px,env(safe-area-inset-bottom)); }
#bUse { right: max(96px,env(safe-area-inset-right)); bottom: max(112px,env(safe-area-inset-bottom)); }
#stick { position: absolute; z-index: 8; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(243,232,166,.5); margin: -55px 0 0 -55px; display: none; pointer-events: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: rgba(243,232,166,.55); }
#slits { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: linear-gradient(#070503 0 16%,transparent 16% 84%,#070503 84%),repeating-linear-gradient(90deg,#070503 0 36px,transparent 36px 46px); box-shadow: inset 0 0 160px 60px rgba(0,0,0,.85); }

/* Jumpscare */
#scare { position: absolute; inset: 0; z-index: 20; display: none; background: #000; overflow: hidden; align-items: center; justify-content: center; }
#scare.on { display: flex; }
#scare img { width: 88vw; height: 88vh; object-fit: contain; animation: scare 1.6s ease-out forwards,shake .07s linear infinite; }
#scare::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.9); animation: flash .45s ease-out forwards; pointer-events: none; }
@keyframes scare { 0% { transform: scale(.6); filter: brightness(1.8) contrast(1.3); } 12% { transform: scale(1.02); } 100% { transform: scale(1.06); filter: brightness(1) contrast(1.4); } }
@keyframes shake { 0% { margin: 0; } 25% { margin: -12px 8px; } 50% { margin: 10px -10px; } 75% { margin: -6px -8px; } 100% { margin: 0; } }
@keyframes flash { to { opacity: 0; } }

/* --- UI Screens --- */
.screen { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(14,11,3,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.screen.hidden { display: none; }

/* Splash (Auto Fullscreen on click/touch) */
#splash { background: #000; z-index: 999; flex-direction: column; gap: 20px; cursor: pointer; }
#splash h1 { font-size: 28px; color: var(--wall); font-weight: 900; text-shadow: 0 0 20px rgba(217,195,90,0.5); margin-bottom: 10px; }
#splash .btn-enter { padding: 18px 50px; font-size: 20px; font-weight: 900; color: #000; background: var(--accent); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px var(--accent); transition: all 0.3s; letter-spacing: 1px; pointer-events: none; }
#splash p { font-size: 14px; color: #aaa; margin-top: 10px; }

/* Main Menu (Left aligned) */
#menu { background: linear-gradient(rgba(14,11,3,.2), rgba(14,11,3,.85)), url('menu.png') center/cover no-repeat; justify-content: flex-start; padding-left: 8vw; background-color: #000; }
@media (max-width: 768px) { #menu { padding-left: 5vw; justify-content: center; align-items: center; } }
.menu-container { display: flex; flex-direction: column; gap: 15px; width: min(260px, 75vw); z-index: 31; }
.glass-btn { width: 100%; padding: 15px; background: rgba(22, 19, 10, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 2px solid rgba(243, 232, 166, 0.4); color: #f3e8a6; border-radius: 12px; font-family: var(--f-body); font-size: 17px; font-weight: 900; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.6); text-align: center; }
.glass-btn:hover, .glass-btn:active { background: var(--accent); color: #000; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 40px rgba(217, 195, 90, 0.4); }

/* Cards / Modals */
.glass-card { position: relative; width: min(550px, 90vw); max-height: 85vh; overflow-y: auto; background: var(--panel); backdrop-filter: blur(20px); border: 2px solid var(--accent); border-radius: 16px; padding: 30px 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); text-align: center; }
h1 { font-size: 32px; font-weight: 900; color: var(--accent); margin-bottom: 10px; letter-spacing: 1px; }
h2 { font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 20px; }
p.lead { font-size: 14px; line-height: 1.8; color: #d0d0d0; margin-bottom: 20px; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.btn-row .glass-btn { flex: 1 1 120px; }

/* Map Selection */
.map-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
.map-grid button { flex: 1 1 30%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(243,232,166,0.2); color: var(--paper); border-radius: 8px; font-family: var(--f-body); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.map-grid button[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(217,195,90,0.4); }
.map-desc { font-size: 13px; color: #aaa; min-height: 40px; margin-bottom: 20px; line-height: 1.5; }
.monster-pick { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.monster-pick button { flex: 1; max-width: 150px; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(243,232,166,0.2); color: var(--paper); border-radius: 8px; font-family: var(--f-body); font-weight: 700; cursor: pointer; transition: all 0.2s; }
.monster-pick button[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(217,195,90,0.4); }

/* Settings & How to */
ul.how { text-align: right; padding-inline-start: 20px; line-height: 2; font-size: 14px; color: #ddd; margin-bottom: 20px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(243,232,166,0.1); }
.row label { font-size: 14px; font-weight: 700; color: #ddd; }
.row .ctl input[type=range] { width: 120px; accent-color: var(--accent); }
.row .ctl output { font-family: var(--f-mono); font-size: 18px; color: var(--accent); min-width: 45px; text-align: left; display: inline-block; }

/* DOM Monster */
#dom-monster { position: absolute; display: none; pointer-events: none; z-index: 4; transform: translate(-50%, -50%); filter: drop-shadow(0 0 15px rgba(0,0,0,0.9)); transform-origin: center center; }

/* Rotate Screen */
#rotate { position: absolute; inset: 0; z-index: 1000; background: var(--ink); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; text-align: center; padding: 20px; }
#rotate svg { width: 60px; height: 60px; fill: var(--accent); animation: rotateAni 2s ease-in-out infinite; }
@keyframes rotateAni { 0%, 20% { transform: rotate(0deg); } 50%, 80% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
@media (orientation: portrait) and (max-width: 1024px) { body.ingame #rotate, body.menu-open #rotate { display: flex; } }
</style>
</head>
<body>

<div id="app">
  <canvas id="gl"></canvas>
  
  <img id="dom-monster" src="monster_pejman.jpg" alt="">

  <div id="touch"></div>
  <div id="stick"><i></i></div>
  <div id="slits" hidden></div>
  <div id="danger"></div>
  <div id="fx" class="on"></div>

  <div id="hud" hidden>
    <div class="tl">
      <div id="rec"><i></i><span>REC</span><span id="clock">00:00</span></div>
      <div id="obj"></div>
    </div>

    <div id="prompt"></div>
    <div id="stamWrap"><div id="stam"></div></div>
  </div>
  
  <button id="bSprint" class="tbtn">Sprint</button>
  <button id="bFlash" class="tbtn">Light</button>
  <button id="bUse" class="tbtn">Hide</button>

  <div id="scare"><img id="scareImg" src="monster_pejman.jpg" alt=""></div>

  <!-- Splash Screen: Click anywhere to fullscreen & rotate -->
  <div id="splash" class="screen">
    <h1>فرار از شهر فرش</h1>
    <button class="btn-enter">ورود به بازی</button>
    <p>برای تجربه بهتر، صفحه تمام‌صفحه و افقی می‌شود</p>
  </div>

  <!-- Main Menu -->
  <section id="menu" class="screen hidden">
    <div class="menu-container">
      <button id="bPlay" class="glass-btn">شروع بازی</button>
      <button id="bSet" class="glass-btn">تنظیمات</button>
      <button id="bHow" class="glass-btn">راهنما</button>
    </div>
  </section>

  <!-- Map Selection Modal -->
  <section id="mapModal" class="screen hidden">
    <div class="glass-card">
      <h2>انتخاب مرحله</h2>
      
      <div class="map-grid" id="mapPick"></div>
      <p class="map-desc" id="mapDesc"></p>

      <div style="margin: 15px 0;">
        <span style="display:block; font-size:14px; font-weight:700; color:var(--accent); margin-bottom:10px;">انتخاب هیولا:</span>
        <div class="monster-pick" id="monsterPick">
          <button type="button" id="mPick_pejman" class="mPickBtn" data-m="pejman">پژمان جمشیدی</button>
          <button type="button" id="mPick_poorang" class="mPickBtn" data-m="poorang">عمو پورنگ</button>
        </div>
      </div>

      <p id="best" style="font-family:var(--f-mono); font-size:18px; color:var(--ok); margin-bottom:20px;"></p>

      <div class="btn-row">
        <button id="bStartGame" class="glass-btn" style="background:var(--accent); color:#000;">شروع</button>
        <button id="bCloseMap" class="glass-btn">بازگشت</button>
      </div>
    </div>
  </section>

  <!-- How to Play -->
  <section id="howScreen" class="screen hidden">
    <div class="glass-card">
      <h2>راهنما</h2>
      <ul class="how" id="howList"></ul>
      <div style="text-align: center; margin-top: 20px;">
        <a href="https://rubika.ir/ZODIAC_MAFIANIGHTS" target="_blank" style="display: inline-block; padding: 12px 24px; font-size: 14px; font-weight: bold; background: #229ED9; color: #fff; border-radius: 8px; text-decoration: none; width: 100%; box-sizing: border-box;">
          📢 کانال روبیکا TNT MOD
        </a>
      </div>
      <div class="btn-row"><button class="backBtn glass-btn">بازگشت</button></div>
    </div>
  </section>

  <!-- Settings -->
  <section id="setScreen" class="screen hidden">
    <div class="glass-card">
      <h2>تنظیمات</h2>
      <div id="setBody"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="backBtn glass-btn">بازگشت</button>
        <button id="bReset" class="glass-btn" style="color:var(--alarm); border-color:var(--alarm);">بازنشانی</button>
      </div>
    </div>
  </section>

  <!-- Pause Screen -->
  <section id="pauseScreen" class="screen hidden">
    <div class="glass-card">
      <h2>توقف</h2>
      <div class="btn-row" style="flex-direction: column;">
        <button id="bResume" class="glass-btn" style="background:var(--accent); color:#000;">ادامه</button>
        <button id="bSet2" class="glass-btn">تنظیمات</button>
        <button id="bQuit" class="glass-btn" style="color:var(--alarm); border-color:var(--alarm);">بازگشت به منو</button>
      </div>
    </div>
  </section>

  <!-- Game Over -->
  <section id="over" class="screen hidden">

      <h2 style="color:var(--alarm); font-size:36px;">گرفتت.</h2>

        <button class="menuBtn glass-btn">منوی اصلی</button>

  </section>

  <!-- Win Screen -->

    <div class="glass-card">
      <h2 style="color:var(--ok); font-size:36px;">فرار کردی!</h2>

        <button class="menuBtn glass-btn">منوی اصلی</button>
      </div>

  <!-- Fallback Rotate Screen -->
  <div id="rotate">
    <svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h10V5H7zm3 12h4v2h-4v-2z"/></svg>
    <span style="font-size:18px; font-weight:700;">برای ادامه بازی، گوشی خود را افقی کنید</span>
  </div>
  
  <audio id="song" src="song.mp3" loop preload="auto"></audio>
  <audio id="menuSong" src="sound.m4a" loop preload="auto"></audio>
  <audio id="runAudio" src="Run.mp3" loop preload="auto"></audio>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));

/* ---------- Auto Fullscreen & Landscape on Splash Touch ---------- */
const splashScreen = $('#splash');
let hasEntered = false;

async function triggerFullscreenAndRotate() {
    if (hasEntered) return;
    hasEntered = true;
    
    try {
        // Attempt fullscreen
        if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen();
        }
        
        // Attempt orientation lock
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(e => console.log('Orientation lock failed:', e));
        }
    } catch (err) {
        console.log('Fullscreen error:', err);
    }
    
    // Transition to menu
    splashScreen.classList.add('hidden');
    $('#menu').classList.remove('hidden');
    document.body.classList.add('menu-open'); // Triggers the rotate overlay if still in portrait
    
    // Start Menu Audio
    initAudio();
    if(menuSong) menuSong.play().catch(()=>{});
}

// Bind to any touch/click on the splash screen to simulate a "user gesture"
splashScreen.addEventListener('click', triggerFullscreenAndRotate);
splashScreen.addEventListener('touchstart', triggerFullscreenAndRotate, {passive: true});

// Check orientation on load and resize
function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isPortrait) {
        document.body.classList.add('menu-open'); // show rotate fallback
    } else {
        document.body.classList.remove('menu-open'); // hide rotate fallback
    }
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
checkOrientation(); // run initially

/* ---------- Settings ---------- */
const DEF={map:'lobby',monster:'pejman',difficulty:'normal',size:'medium',bottles:5,musicRange:28,sens:1.2,fov:75,invertY:false,bob:true,bright:1,fog:60,vhs:true,minimap:true,quality:'high',master:.8,music:1,ambient:.6,lang:'fa'};
let S={...DEF};
try{Object.assign(S,JSON.parse(localStorage.getItem('br_settings')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('br_settings',JSON.stringify(S))}catch(e){}};

const SCHEMA=[
 {g:'gameplay',items:[
  {k:'difficulty',t:'seg',o:['easy','normal','hard','nightmare']},
  {k:'size',t:'seg',o:['small','medium','large']},
  {k:'bottles',t:'range',min:3,max:10,step:1},
  {k:'musicRange',t:'range',min:10,max:50,step:1,u:' m'}]},
 {g:'controls',items:[
  {k:'sens',t:'range',min:.5,max:4,step:.1,u:'x'},
  {k:'fov',t:'range',min:60,max:110,step:1,u:'°'},
  {k:'invertY',t:'check'},{k:'bob',t:'check'}]},
 {g:'graphics',items:[
  {k:'bright',t:'range',min:.6,max:1.6,step:.05,u:'x'},
  {k:'fog',t:'range',min:0,max:100,step:5,u:'%'},
  {k:'vhs',t:'check'},{k:'minimap',t:'check'},
  {k:'quality',t:'seg',o:['low','mid','high']}]},
 {g:'audio',items:[
  {k:'master',t:'range',min:0,max:1,step:.05,pct:1},
  {k:'music',t:'range',min:0,max:1,step:.05,pct:1},
  {k:'ambient',t:'range',min:0,max:1,step:.05,pct:1}]},
 {g:'language',items:[{k:'lang',t:'seg',o:['fa','en']}]}
];

/* ---------- strings ---------- */
const I={
fa:{sub:'LEVEL 0 · لابی شهر فرش',title:'فرار از شهر فرش',

function mkTex(w,h,draw,rep){

  if(rep)t.repeat.set(rep[0],rep[1]);return t;
}

}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function genMaze(n,braid=.16,roomK=.45,pillarP=.55){
  const g=2*n+1,m=[];lastRooms=[];
  for(let i=0;i<g;i++)m.push(new Uint8Array(g).fill(1));
  const st=[[1,1]];m[1][1]=0;
  while(st.length){
    const [x,z]=st[st.length-1];
    const ds=shuffle([[2,0],[-2,0],[0,2],[0,-2]]).filter(([a,b])=>{const nx=x+a,nz=z+b;return nx>0&&nz>0&&nx<g-1&&nz<g-1&&m[nx][nz]===1});
    if(!ds.length){st.pop();continue}
    const [a,b]=ds[0];m[x+a/2][z+b/2]=0;m[x+a][z+b]=0;st.push([x+a,z+b]);
  }
  for(let x=1;x<g-1;x++)for(let z=1;z<g-1;z++)if(m[x][z]===1&&((x%2===0)!==(z%2===0))&&Math.random()<braid)m[x][z]=0;
  const rooms=Math.round(n*roomK);
  for(let r=0;r<rooms;r++){
    const cw=ri(2,3),ch=ri(2,3),a=ri(0,n-cw),b=ri(0,n-ch);
    lastRooms.push({x0:2*a+1,x1:2*(a+cw)-1,z0:2*b+1,z1:2*(b+ch)-1});
    for(let x=2*a+1;x<=2*(a+cw)-1;x++)for(let z=2*b+1;z<=2*(b+ch)-1;z++){
      m[x][z]=0;
      if(x%2===0&&z%2===0&&Math.random()<pillarP)m[x][z]=1;
    }
  }
  return m;
}
function bfs(si,sj){
  const d=new Int16Array(G*G).fill(-1),q=new Int32Array(G*G);let h=0,t=0;
  d[si*G+sj]=0;q[t++]=si*G+sj;
  while(h<t){
    const k=q[h++],i=(k/G)|0,j=k%G,dd=d[k]+1;
    for(const [a,b] of DIRS){
      const ni=i+a,nj=j+b;
      if(ni<0||nj<0||ni>=G||nj>=G||maze[ni][nj]===1)continue;
      const nk=ni*G+nj;if(d[nk]<0){d[nk]=dd;q[t++]=nk}
    }
  }
  return d;
}
const solid=(i,j)=>i<0||j<0||i>=G||j>=G||maze[i][j]===1;
function hitWall(x,z){
  const a=Math.round((x-PR)/TS),b=Math.round((x+PR)/TS),c=Math.round((z-PR)/TS),d=Math.round((z+PR)/TS);
  if(solid(a,c)||solid(a,d)||solid(b,c)||solid(b,d))return true;
  for(const q of closets){if(x+PR>q.x0&&x-PR<q.x1&&z+PR>q.z0&&z-PR<q.z1)return true}
  for(const q of blocks){if(Math.abs(q.cx-x)<4&&Math.abs(q.cz-z)<4&&x+PR>q.x0&&x-PR<q.x1&&z+PR>q.z0&&z-PR<q.z1)return true}
  return false;
}
function los(x0,z0,x1,z1){
  const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/.7);
  for(let k=1;k<n;k++){const f=k/n;if(solid(Math.round((x0+(x1-x0)*f)/TS),Math.round((z0+(z1-z0)*f)/TS)))return false}
  return true;
}

function layoutShop(n){

  Mo.spawn={i:mc[0],j:mc[1]};

let AC=null,hum=null,noiseBuf=null;
const song=$('#song');let songVol=0;
const menuSong = document.getElementById('menuSong');
const runAudio = document.getElementById('runAudio');

function initAudio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
      const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      const out=AC.createGain();out.gain.value=0;out.connect(AC.destination);
      const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(out);
      [[60,'sawtooth',.5],[120,'sine',.6],[180,'triangle',.2]].forEach(([f,t,v])=>{const o=AC.createOscillator();o.type=t;o.frequency.value=f;const gg=AC.createGain();gg.gain.value=v;o.connect(gg);gg.connect(lp);o.start()});
      const ns=AC.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;
      const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3600;bp.Q.value=9;
      const ng=AC.createGain();ng.gain.value=.05;ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start();
      hum=out;
    }catch(e){AC=null}
  }
  if(AC&&AC.state==='suspended')AC.resume();
  try{song.volume=0;const p=song.play();if(p&&p.then)p.then(()=>{song.pause();song.currentTime=0}).catch(()=>{})}catch(e){}
}
function sfxGain(v){const g=AC.createGain();g.gain.value=v*S.master;g.connect(AC.destination);return g}
let lastBreathT = 0;
function sfxBreath(isHeavy){
  if(!AC)return;
  if(AC.currentTime - lastBreathT < (isHeavy ? 0.65 : 1.25)) return;
  lastBreathT = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = isHeavy ? 650 : 420; f.Q.value = 1.1;
  const g = sfxGain(isHeavy ? .32 : .16);
  const now = AC.currentTime;
  g.gain.setValueAtTime((isHeavy ? .3 : .14)*S.master, now);
  g.gain.exponentialRampToValueAtTime(.001, now + (isHeavy ? .32 : .45));
  s.connect(f); f.connect(g);
  s.start(now, Math.random()*2, isHeavy ? .32 : .45);
}
function sfxStep(){
  if(!AC)return;
  const now=AC.currentTime;
  try{
    const osc=AC.createOscillator();
    const og=AC.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(68,now);
    osc.frequency.exponentialRampToValueAtTime(34,now+0.12);
    og.gain.setValueAtTime(0,now);
    og.gain.linearRampToValueAtTime(0.22*S.master,now+0.012);
    og.gain.exponentialRampToValueAtTime(0.001,now+0.16);
    osc.connect(og);og.connect(AC.destination);
    osc.start(now);osc.stop(now+0.18);
  }catch(e){}
  if(noiseBuf){
    try{
      const s=AC.createBufferSource();s.buffer=noiseBuf;
      const f=AC.createBiquadFilter();f.type='lowpass';
      f.frequency.setValueAtTime(105,now);
      f.Q.value=0.6;
      const g=AC.createGain();
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.15*S.master,now+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.14);
      s.connect(f);f.connect(g);g.connect(AC.destination);
      s.start(now,Math.random()*2,0.18);
    }catch(e){}
  }
}
function sfxSplash(){
  if(!AC)return;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.8;
  const g=sfxGain(.4);g.gain.setValueAtTime(.4*S.master,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);
  s.connect(f);f.connect(g);s.start(AC.currentTime,Math.random(),.28);
}
function sfxTone(freqs,dur,type,vol){
  if(!AC)return;
  freqs.forEach((f,k)=>{
    const o=AC.createOscillator();o.type=type||'sine';
    const t0=AC.currentTime+k*.09;o.frequency.setValueAtTime(f,t0);
    const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime((vol||.2)*S.master,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);
  });
}
function sfxScream(){
  if(!AC)return;
  const t0=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(900,t0);bp.frequency.exponentialRampToValueAtTime(2800,t0+.5);bp.Q.value=1.4;
  const g=AC.createGain();g.gain.setValueAtTime(1.1*S.master,t0);g.gain.exponentialRampToValueAtTime(.001,t0+1.8);
  s.connect(bp);bp.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+1.9);
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(70,t0);o.frequency.exponentialRampToValueAtTime(420,t0+.35);
  const og=AC.createGain();og.gain.setValueAtTime(.7*S.master,t0);og.gain.exponentialRampToValueAtTime(.001,t0+1.4);
  o.connect(og);og.connect(AC.destination);o.start(t0);o.stop(t0+1.5);
}
function musicUpdate(d,dt){
  const R=S.musicRange;
  const near=Mo.active&&d<R&&state==='playing';
  const want=near||state==='over';
  let tgt=0;
  if(state==='over')tgt=clamp(S.music*S.master,0,1);
  else if(near)tgt=S.music*S.master*Math.pow(clamp((R-d)/(R*.75),0,1),.8);
  if(want&&song.paused){try{song.currentTime=0;const p=song.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
  songVol+=(tgt-songVol)*Math.min(1,dt*(tgt>songVol?4:1.6));
  song.volume=clamp(songVol,0,1);
  if(!want&&songVol<.01&&!song.paused)song.pause();
}
function stopMusic(){songVol=0;try{song.volume=0;song.pause()}catch(e){}}

  });

  }
  const ang=Math.atan2(-Math.cos(P.yaw),-Math.sin(P.yaw));
  mctx.save();mctx.translate(cx,cx);mctx.rotate(ang);mctx.fillStyle='#fff';mctx.beginPath();mctx.moveTo(7,0);mctx.lineTo(-5,-4.5);mctx.lineTo(-5,4.5);mctx.closePath();mctx.fill();mctx.restore();
}

  flT-=dt;
  if(flT<0){flLeft=rnd(.2,.7);flT=rnd(5,12)-danger*4}
  if(flLeft>0){flLeft-=dt;fl=Math.random()<.5?.3:1}
  else if(danger>.45&&Math.random()<danger*.08)fl=.45;
  else fl=1;
  ambient.intensity=MP().amb[1]*S.bright*(.35+.65*fl);
  plight.intensity=MP().plight[1]*(.5+.5*fl);
  panelMat.color.setHex(MP().panel).multiplyScalar(.4+.6*fl);
  if(hum&&AC)hum.gain.value=.055*S.ambient*S.master*(.5+.5*fl);
}
const promptEl=$('#prompt'),bUse=$('#bUse');
function nearCloset(){
  let best=null,bd=3.2;
  for(const c of closets){const dd=Math.hypot(c.x+c.fx*1.2-P.x,c.z+c.fz*1.2-P.z);if(dd<bd){bd=dd;best=c}}
  return best;
}
function toggleHide(){
  if(state!=='playing')return;
  if(Hd.on){
    const c=Hd.c;Hd.on=false;Hd.cool=1.5;Hd.findT=0;
    P.x=c.x+c.fx*1.3;P.z=c.z+c.fz*1.3;
    $('#slits').hidden=true;flash.intensity=flashOn?1.5:0;
    sfxTone([120],.15,'square',.1);return;
  }
  if(Hd.cool>0)return;
  const c=nearCloset();if(!c)return;
  const dm=Mo.active?Math.hypot(Mo.x-P.x,Mo.z-P.z):99;
  Hd.knows=Mo.active&&dm<22&&los(Mo.x,Mo.z,P.x,P.z);
  Hd.on=true;Hd.c=c;Hd.findT=0;Hd.beat=0;Hd.fate=null;
  P.x=c.x;P.z=c.z;P.yaw=c.yaw;P.pitch=0;flash.intensity=0;
  Mo.search=rnd(5,8);Mo.wT=0;flowT=0;
  $('#slits').hidden=false;toast(tr('msgHidden'),2400);
  sfxTone([140],.15,'square',.1);
}
function updatePlayer(dt){
  if(Hd.on){
    P.stam=clamp(P.stam+20*dt,0,100);stamEl.style.width=P.stam+'%';
    if(runAudio && !runAudio.paused) runAudio.pause();
    return false;
  }
  Hd.cool=Math.max(0,Hd.cool-dt);
  const k=keys;
  let f=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0)+joy.y;
  let s=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0)+joy.x;
  const len=Math.hypot(f,s);if(len>1){f/=len;s/=len}
  const moving=len>.08;
  const wantSprint=(k.ShiftLeft||k.ShiftRight||tSprint)&&moving;
  if(P.stam<=0)P.tired=true;else if(P.stam>25)P.tired=false;
  const inW=!!(water&&water[Math.round(P.x/TS)*G+Math.round(P.z/TS)]);
  const sprinting=wantSprint&&!P.tired&&!inW;
  P.stam=clamp(P.stam+(sprinting?-24:14)*dt,0,100);
  
  const sp=(sprinting?6.8:4.0)*(inW?.85:1);
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  const dx=(fx*f+rx*s)*sp*dt,dz=(fz*f+rz*s)*sp*dt;
  if(!hitWall(P.x+dx,P.z))P.x+=dx;
  if(!hitWall(P.x,P.z+dz))P.z+=dz;
  
  if(moving){
    P.bob+=dt*(sprinting?11.5:7.5);
    const ph=Math.sin(P.bob);
    
    if(!sprinting && (ph>0)!==(P.stepPh>0)&&Math.abs(ph)<.3) {
        (inW?sfxSplash():sfxStep());
    }
    P.stepPh=ph;
  }
  
  if (runAudio) {
    if (sprinting) {
      runAudio.volume = S.master * 0.6;
      if (runAudio.paused) {
        runAudio.play().catch(()=>{});
      }
    } else {
      if (!runAudio.paused) {
        runAudio.pause();
      }
    }
  }

  stamEl.style.width=P.stam+'%';stamEl.classList.toggle('low',P.tired);
  return moving;
}
function updateMonster(dt){
  if(!Mo.active){
    grace-=dt;
    if(grace<=0){
      Mo.active=true;Mo.x=Mo.spawn.i*TS;Mo.z=Mo.spawn.j*TS;
      monster.visible=true;Mo.chase=0;Mo.state='patrol';
      Mo.alertTimer=0;Mo.patrolTimer=0;Mo.patrolField=null;
    }
    return 99;
  }
  Mo.t+=dt;
  const dxp=P.x-Mo.x,dzp=P.z-Mo.z,d=Math.hypot(dxp,dzp);
  
  const sees=!Hd.on&&d<25&&los(Mo.x,Mo.z,P.x,P.z);
  const pMoving=(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||Math.hypot(joy.x,joy.y)>.08);
  const pSprinting=pMoving&&(keys.ShiftLeft||keys.ShiftRight||tSprint);
  const hears=!Hd.on&&((pSprinting&&d<10)||(pMoving&&d<3));

  if(sees){
    Mo.state='chase';
    Mo.targetX=P.x;Mo.targetZ=P.z;
    Mo.lastSeenT=Mo.t;
    Mo.chase+=dt;
  } else if(hears && Mo.state !== 'chase'){
    Mo.state='investigate';
    Mo.targetX=P.x;Mo.targetZ=P.z;
  } else if(Mo.state === 'chase'){
    if(Mo.t - Mo.lastSeenT > 5.0){
      Mo.state='search';
      Mo.searchTimer = 3.0;
    }
  } else if(Mo.state === 'search'){
    Mo.searchTimer -= dt;
    if(Mo.searchTimer <= 0){
      Mo.state='patrol';
    }
  } else {
    Mo.state='patrol';
    Mo.chase=Math.max(0,Mo.chase-dt*0.5);
  }

  let sp=(BASE[S.difficulty]||4.5)+Math.min(2.0,Mo.chase*0.015);
  if(Mo.state==='chase')sp*=1.15;
  else if(Mo.state==='search'||Mo.state==='investigate')sp*=1.05;
  else sp*=0.9;

  const mInW=!!(water&&water[Math.round(Mo.x/TS)*G+Math.round(Mo.z/TS)]);
  if(mInW){
    sp*=0.72;
    Mo.splashTimer+=dt;
    if(Mo.splashTimer>0.48&&d<26){sfxSplash();Mo.splashTimer=0}
  }

  let field=null;
  if(Mo.state==='chase'||Mo.state==='investigate'||Mo.state==='search'){
    flowT-=dt;
    if(flowT<=0||!flow){
      flow=bfs(Math.round(Mo.targetX/TS),Math.round(Mo.targetZ/TS));
      flowT=0.28;
    }
    field=flow;
  }else{
    Mo.patrolTimer-=dt;
    if(Mo.patrolTimer<=0||!Mo.patrolField){
      const r=reach[(Math.random()*reach.length)|0];
      Mo.patrolField=bfs(r[0],r[1]);
      Mo.patrolTimer=rnd(12,18);
    }
    field=Mo.patrolField;
  }

  let tx=Mo.targetX,tz=Mo.targetZ;
  if(field && Mo.state !== 'chase'){
    const mi=Math.round(Mo.x/TS),mj=Math.round(Mo.z/TS);
    const cur=(mi>=0&&mj>=0&&mi<G&&mj<G)?field[mi*G+mj]:-1;
    if(cur>0){
      let best=cur,bi=mi,bj=mj;
      for(const [a,b] of DIRS){
        const ni=mi+a,nj=mj+b;
        if(ni<0||nj<0||ni>=G||nj>=G)continue;
        const v=field[ni*G+nj];
        if(v>=0&&v<best){best=v;bi=ni;bj=nj}
      }
      tx=bi*TS;tz=bj*TS;
    }
  }else{
    tx=P.x;tz=P.z;
  }

  const ddx=tx-Mo.x,ddz=tz-Mo.z,dl=Math.hypot(ddx,ddz);
  if(dl>0.01&&Mo.searchTimer<=0){
    const st=Math.min(dl,sp*dt);
    Mo.x+=(ddx/dl)*st;
    Mo.z+=(ddz/dl)*st;
  }
  if(Mo.searchTimer>0)Mo.searchTimer-=dt;

  if(Hd.on){
    if(Hd.knows){
      Mo.targetX=P.x;Mo.targetZ=P.z;
      Mo.state='chase';
    }else if(Mo.state==='chase'&&d>3.0){
      Mo.state='search';
      Mo.searchTimer=4.0;
    }
  }

  Mo.far=d>52?Mo.far+dt:0;
  if(Mo.far>15){
    for(let a=0;a<60;a++){
      const r=reach[(Math.random()*reach.length)|0],x=r[0]*TS,z=r[1]*TS,dd=Math.hypot(x-P.x,z-P.z);
      if(dd>24&&dd<38&&!los(x,z,P.x,P.z)){
        Mo.x=x;Mo.z=z;Mo.state='patrol';Mo.patrolField=null;Mo.alertTimer=0;
        break;
      }
    }
    Mo.far=0;
  }

  const ms=Math.min(3.1,H*0.68);
  const v = new THREE.Vector3(Mo.x, ms*0.63, Mo.z);
  const distToCam = v.distanceTo(camera.position);
  v.project(camera);

  const domMonster = document.getElementById('dom-monster');
  if (v.z > 1 || !los(Mo.x, Mo.z, P.x, P.z)) {
      domMonster.style.display = 'none';
  } else {
      const x = (v.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
      domMonster.style.display = 'block';
      domMonster.style.left = x + 'px';
      domMonster.style.top = y + 'px';
      
      const size = (window.innerHeight / distToCam) * 2.5; 
      domMonster.style.width = size + 'px';
      const wob = Math.sin(Mo.t*15) * 3;
      domMonster.style.transform = `translate(calc(-50% + ${wob}px), -50%)`;
  }
  
  monster.visible = false; 

  if(typeof monsterLight!=='undefined'&&monsterLight){
    monsterLight.position.set(Mo.x,1.8,Mo.z);
    monsterLight.intensity=sees?(1.5+Math.sin(Mo.t*12)*0.3):0.9;
  }

  if(Hd.on){
    const lim=Hd.knows?0.7:({easy:4.5,normal:3.5,hard:2.8,nightmare:2}[S.difficulty]||3.5);
    if(d>6)Hd.fate=null;
    if(d<3.4&&Hd.fate==null)Hd.fate=Math.random()<({easy:.25,normal:.45,hard:.6,nightmare:.8}[S.difficulty]||.45);
    if(d<3.4&&(Hd.knows||Hd.fate)){
      Hd.findT+=dt;
      if(Hd.findT>lim)die();
    }else{
      Hd.findT=Math.max(0,Hd.findT-dt*0.5);
    }
  }else if(d<1.35){
    die();
  }
  return d;
}
function updateBottles(dt){
  bottles.forEach(b=>{
    if(b.userData.got)return;
    b.rotation.y+=dt*1.6;b.position.y=.9+Math.sin(simT*2+b.userData.i)*.08;
    if(Math.hypot(b.position.x-P.x,b.position.z-P.z)<1.6){
      b.userData.got=true;b.visible=false;got++;
      sfxTone([880,1320],.35,'sine',.22);
      if(got>=S.bottles){
        unlocked=true;toast(tr('msgUnlock'),4200);sfxTone([523,659,784],.6,'triangle',.2);
        const u=exitObj.userData;u.door.material.emissive.setHex(0x1a8a3a);u.beam.material.opacity=.28;u.elight.intensity=1.6;
      }else toast(tr('msgGot',{n:got,t:S.bottles}),2200);
      updateObjective();
    }
  });
  if(exitObj){
    const dd=Math.hypot(exitObj.position.x-P.x,exitObj.position.z-P.z);
    if(dd<2.3){
      if(unlocked)win();
      else if(simT-nearMsgT>4){nearMsgT=simT;toast(tr('msgLocked'),2400)}
    }
    if(unlocked)exitObj.userData.beam.material.opacity=.22+Math.sin(simT*3)*.06;
  }
}

let last=performance.now(),miniT=0,msgDanger=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;simT+=dt;
  let d=99;
  if(state==='playing'){
    elapsed+=dt;
    const moving=updatePlayer(dt);
    d=updateMonster(dt);
    updateBottles(dt);
    {
      const nc=Hd.on?Hd.c:(Hd.cool<=0?nearCloset():null);
      promptEl.textContent=Hd.on?tr('unhide'):(nc?tr('hide'):'');
      promptEl.classList.toggle('on',!!nc);
      if(touchMode)bUse.style.display=nc?'block':'none';
    }
    const ci=Math.round(P.x/TS),cj=Math.round(P.z/TS);
    for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){const i=ci+a,j=cj+b;if(i>=0&&j>=0&&i<G&&j<G)disc[i*G+j]=1}
    danger=Mo.active?clamp(1-d/S.musicRange,0,1):0;
    if(Hd.on){Hd.beat-=dt;if(Hd.beat<=0){Hd.beat=1.3-.8*danger;sfxTone([58],.25,'sine',.6);setTimeout(()=>sfxTone([48],.22,'sine',.45),170)}}
    if(danger>.6&&simT-msgDanger>14){msgDanger=simT;toast(tr('msgNear'),1800)}
    clockEl.textContent=fmt(elapsed);
    miniT+=dt;if(miniT>.05){miniT=0;drawMini()}
    const bobAmt=S.bob&&moving?Math.sin(P.bob)*.045:0;
    const sh=danger*danger*.05;
    camera.position.set(P.x+rnd(-sh,sh),1.75+bobAmt+rnd(-sh,sh),P.z+rnd(-sh,sh));
    camera.rotation.set(P.pitch,P.yaw,rnd(-sh,sh)*.4);
    const fv=S.fov+danger*danger*9;
    if(Math.abs(camera.fov-fv)>.05){camera.fov=fv;camera.updateProjectionMatrix()}
    dangerEl.style.opacity=(Math.pow(danger,1.6)*.75).toFixed(3);
  }else{
    if(state==='menu'||state==='paused'){dangerEl.style.opacity=0}
    if(state==='menu'){camera.position.set(P.x||0,1.62,P.z||0);camera.rotation.set(0,simT*.15,0)}
    if(runAudio && !runAudio.paused) runAudio.pause();
  }
  updateFlicker(dt);
  if(state==='playing'||state==='over')musicUpdate(d,dt);
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
applyRenderSize();
  if(typeof setMonster==='function')setMonster(S.monster||'pejman');
applyLang();
buildSettings();
applySettings();
buildWorld();
camera.position.set(P.x,1.62,P.z);
show('splash');
window.__br={get S(){return S},get blocks(){return blocks},get water(){return water},build:buildWorld,get state(){return state},P,Mo,Hd,get closets(){return closets},get got(){return got},get G(){return G},start:startGame,get maze(){return maze},TS};
requestAnimationFrame(loop);
})();
